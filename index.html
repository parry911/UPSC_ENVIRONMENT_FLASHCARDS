<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC Environment Retrieval Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f0ede6;--surface:#fafaf7;--surface2:#f2efea;
--border:rgba(40,35,20,.1);--border2:rgba(40,35,20,.2);
--text:#1c1810;--text2:#4a4535;--text3:#8a8270;
--r:#2a6049;--n:#1e3a5c;--w:#7a2c00;--sp:#4a1a6e;--c:#5c4300;--rv:#8a1538;
--r-l:#d9ece4;--n-l:#dae6f2;--w-l:#f2e0d6;--sp-l:#e6dcf0;--c-l:#f0e9d0;--rv-l:#f2dde3;
--known:#2a6049;--review:#b83400;
--serif:'Playfair Display',Georgia,serif;--sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
--shadow:0 1px 8px rgba(0,0,0,.06),0 2px 20px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
header{background:var(--text);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd-title{font-family:var(--serif);color:#f0ede6;font-size:19px}
.hd-sub{font-family:var(--mono);color:#f0ede685;font-size:9.5px;margin-top:3px;letter-spacing:.05em}
.hd-stats{display:flex;gap:7px;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.08);border-radius:8px;padding:5px 10px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.hstat-n{font-family:var(--mono);font-size:15px;font-weight:500;color:#f0ede6;display:block}
.hstat-l{font-size:8.5px;color:#f0ede665;letter-spacing:.05em;text-transform:uppercase}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 15px;font-size:12px;font-weight:500;font-family:var(--sans);border:none;background:transparent;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.ar{color:var(--r);border-bottom-color:var(--r)}
.tab.an{color:var(--n);border-bottom-color:var(--n)}
.tab.aw{color:var(--w);border-bottom-color:var(--w)}
.tab.asp{color:var(--sp);border-bottom-color:var(--sp)}
.tab.ac{color:var(--c);border-bottom-color:var(--c)}
.tab.arv{color:var(--rv);border-bottom-color:var(--rv)}
.tab.af{color:var(--text2);border-bottom-color:var(--text2)}
.dot{width:7px;height:7px;border-radius:50%}
.body{max-width:860px;margin:0 auto;padding:18px 16px 80px}
.strategy{border-radius:10px;padding:13px 17px;margin-bottom:16px;border-left:3px solid}
.strategy.sr{border-color:var(--r);background:var(--r-l)}
.strategy.sn{border-color:var(--n);background:var(--n-l)}
.strategy.sw{border-color:var(--w);background:var(--w-l)}
.strategy.ssp{border-color:var(--sp);background:var(--sp-l)}
.strategy.sc{border-color:var(--c);background:var(--c-l)}
.strategy.srv{border-color:var(--rv);background:var(--rv-l)}
.strat-title{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
.strat-body{font-size:12.5px;color:var(--text2);line-height:1.6}
.controls{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.controls select,.controls input{font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);flex:1;min-width:145px}
.btn{padding:7px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12.5px;font-family:var(--sans);color:var(--text2);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-rv{font-weight:600}
.btn-rv.active{background:#fef3e6;border-color:#c85000;color:#c85000}
.score{display:flex;gap:9px;margin-bottom:13px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;font-size:11.5px;font-family:var(--mono);padding:4px 10px;border-radius:99px;border:1px solid}
.pill-k{color:var(--known);border-color:#2a604940;background:#2a604908}
.pill-r{color:var(--review);border-color:#b8340040;background:#b8340008}
.pill-l{color:var(--text3);border-color:var(--border);background:var(--surface)}
.pbar{flex:1;height:3px;background:var(--border);border-radius:2px;min-width:60px}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.rv-banner{background:#fff8f0;border:1px solid #c8500040;border-radius:10px;padding:10px 15px;margin-bottom:13px;font-size:12.5px;color:#c85000;font-weight:500;display:none}
.rv-banner.show{display:block}
.card-wrap{perspective:1200px;cursor:pointer;margin-bottom:13px}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.4,0,.2,1);border-radius:14px;min-height:250px}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;box-shadow:var(--shadow)}
.front{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 22px}
.back{transform:rotateY(180deg);background:var(--surface2);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;justify-content:flex-start}
.card-badge{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:9px}
.cue-front{font-size:13px;color:var(--text2);line-height:1.55;text-align:center;max-width:90%;margin-bottom:12px}
.card-name{font-family:var(--serif);font-size:25px;font-weight:400;line-height:1.15;margin-bottom:7px}
.card-name.card-question{font-family:var(--sans);font-size:16px;font-weight:400;line-height:1.55;max-width:92%;color:var(--text2)}
.card-sub{font-size:12px;color:var(--text3)}
.flip-hint{font-size:10px;color:var(--text3);margin-top:14px;font-family:var(--mono)}
.back-header{font-family:var(--mono);font-size:9.5px;color:var(--text3);letter-spacing:.03em}
.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fact{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.fact-k{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.fact-v{font-size:11.5px;color:var(--text);line-height:1.45}
.hook{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.hook-k{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.hook-v{font-size:12px;color:var(--text2);line-height:1.55}
.trap{background:#fffaf0;border:1px solid #d9a05540;border-radius:8px;padding:8px 11px}
.trap-k{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#9a6a1a;margin-bottom:3px}
.trap-v{font-size:11.5px;color:#6b4a10;line-height:1.5}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:9.5px;padding:3px 8px;border-radius:99px;font-weight:500}
.badge-tr{background:#fde8d5;color:#7a2c00}
.badge-un{background:#d4e4f5;color:#1e3a5c}
.badge-mx{background:#fef3c7;color:#92400e}
.badge-ra{background:#d9ece4;color:#2a6049}
.badge-br{background:#e6dcf0;color:#4a1a6e}
.badge-np{background:#e4eef7;color:#1e3a5c}
.badge-cr{background:#ffe0e0;color:#9b0000}
.badge-en{background:#ffeed0;color:#7a4000}
.badge-vu{background:#fdf8cc;color:#635900}
.badge-nt{background:#e4f2e4;color:#2a5a2a}
.badge-lc{background:#eef0ee;color:#4a554a}
.asof{font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:11px}
.nav-btn{padding:9px 21px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;font-family:var(--sans);color:var(--text2)}
.nav-btn:hover{background:var(--surface2)}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--text3);min-width:76px;text-align:center}
.marks{display:flex;gap:8px;justify-content:center;margin-bottom:26px}
.mark{padding:9px 19px;border-radius:8px;border:1.5px solid;font-family:var(--sans);font-size:12.5px;cursor:pointer;font-weight:500}
.mk{color:var(--known);border-color:#2a604950;background:#2a604908}
.mk:hover{background:#2a604918}
.mr{color:var(--review);border-color:#b8340050;background:#b8340008}
.mr:hover{background:#b8340015}
.ms{color:var(--text3);border-color:var(--border);background:var(--surface)}
.qf-section{display:none}
.qf-section.visible{display:block}
.qf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px 19px;margin-bottom:13px}
.qf-title{font-family:var(--serif);font-size:16px;margin-bottom:4px}
.qf-date{font-family:var(--mono);font-size:9.5px;color:var(--text3);margin-bottom:11px}
.qf-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.qf-item{background:var(--surface2);border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.5}
.qf-k{font-weight:600;color:var(--text2);font-size:10px;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
@media(max-width:580px){
header{flex-direction:column;align-items:flex-start}
.card-name{font-size:20px}
.fact-grid{grid-template-columns:1fr}
.qf-grid{grid-template-columns:1fr}
.back{padding:15px 13px}
}
</style>
</head>
<body>
<header>
<div>
<div class="hd-title">India Protected Areas &amp; Species</div>
<div class="hd-sub" id="hdSub">UPSC PRELIMS RETRIEVAL DECK</div>
</div>
<div class="hd-stats" id="hdStats"></div>
</header>
<div class="tabs">
<button class="tab ar" id="tab-r" onclick="switchTab('r')"><span class="dot" style="background:#52b788"></span><span id="lbl-r">Ramsar</span></button>
<button class="tab" id="tab-n" onclick="switchTab('n')"><span class="dot" style="background:#4a90c8"></span><span id="lbl-n">National Parks</span></button>
<button class="tab" id="tab-w" onclick="switchTab('w')"><span class="dot" style="background:#c4714e"></span><span id="lbl-w">Sanctuaries &amp; Reserves</span></button>
<button class="tab" id="tab-sp" onclick="switchTab('sp')"><span class="dot" style="background:#9b59b6"></span><span id="lbl-sp">Species</span></button>
<button class="tab" id="tab-c" onclick="switchTab('c')"><span class="dot" style="background:#b39400"></span><span id="lbl-c">Concepts &amp; Law</span></button>
<button class="tab" id="tab-rv" onclick="switchTab('rv')"><span class="dot" style="background:#c2185b"></span><span id="lbl-rv">Reverse Retrieval</span></button>
<button class="tab" id="tab-facts" onclick="switchTab('facts')">Quick Facts</button>
</div>
<div class="body">
<div class="strategy sr" id="stratBox">
<div class="strat-title" id="stratTitle">Loading…</div>
<div class="strat-body" id="stratBody"></div>
</div>
<div class="controls">
<select id="filterSel" onchange="applyFilter()"></select>
<input type="text" id="searchBox" placeholder="Search name, state, species, river…" oninput="applyFilter()">
<button class="btn btn-rv" id="rvBtn" onclick="toggleReviewMode()">↻ Practice Weak</button>
<button class="btn" onclick="shuffleDeck()">⇌ Shuffle</button>
<button class="btn" onclick="resetScores()">↺ Reset</button>
</div>
<div class="rv-banner" id="rvBanner"></div>
<div class="score">
<div class="pill pill-k">✓ <span id="knownCt">0</span> known</div>
<div class="pill pill-r">↻ <span id="reviewCt">0</span> review</div>
<div class="pill pill-l"><span id="leftCt">0</span> left</div>
<div class="pbar"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
</div>
<div id="cardArea">
<div class="card-wrap" onclick="flipCard()">
<div class="card-inner" id="cInner">
<div class="card-face front" id="cFront">
<div class="card-name" id="cName">Loading…</div>
<div class="flip-hint" id="cFlipHint">tap to reveal ↑</div>
</div>
<div class="card-face back">
<div class="back-header" id="bHeader"></div>
<div class="fact-grid" id="bFacts"></div>
<div class="hook"><div class="hook-k">Retrieval Hook</div><div class="hook-v" id="bHook"></div></div>
<div id="bTrapWrap" class="trap" style="display:none"><div class="trap-k">Exam Trap</div><div class="trap-v" id="bTrap"></div></div>
<div class="badges" id="bBadges"></div>
<div class="asof" id="bAsOf"></div>
</div>
</div>
</div>
<div class="nav">
<button class="nav-btn" onclick="nav(-1)">← Prev</button>
<div class="counter" id="counter">—</div>
<button class="nav-btn" onclick="nav(1)">Next →</button>
</div>
<div class="marks">
<button class="mark mk" onclick="mark('k')">✓ Know it</button>
<button class="mark mr" onclick="mark('r')">↻ Need review</button>
<button class="mark ms" onclick="nav(1)">Skip →</button>
</div>
</div>
<div class="qf-section" id="qfSection"></div>
</div>
<script>
/* ============================================================
   CURRENT — SINGLE SOURCE OF TRUTH FOR NATIONAL TOTALS
   These are NATIONAL REFERENCE TOTALS (metadata).
   Deck card counts are computed separately via data.length.
   Every figure is source-qualified and dated. Where authoritative
   sources disagree, the disagreement is PRESERVED, not resolved.
   ============================================================ */
const CURRENT = {
  asOf: '27 August 2026',

  ramsar: {
    n: 101,
    date: '3 Aug 2026',
    source: 'Ramsar Convention — India country profile',
    note: '101st = Glaw Lake, Lohit district, Arunachal Pradesh (3 Aug 2026); the State\'s first Ramsar Site'
  },

  // NATIONAL PARK COUNT IS DELIBERATELY NOT PRESENTED AS SETTLED.
  // WII's aggregate page and Odisha's official release disagree.
  nationalParks: {
    wiiAggregate: 106,
    wiiDate: '5 Aug 2025',
    wiiSource: 'WII National Wildlife Database — National Parks page',
    odishaOrdinal: 107,
    odishaDate: '24 Apr 2025',
    odishaSource: 'Government of Odisha official release declaring Similipal',
    reconciled: false,
    note: 'WII\'s aggregate page still reports 106 (last updated 5 Aug 2025). Odisha\'s official 24 Apr 2025 release calls Similipal India\'s 107th National Park. State-level lists also differ on allocations (e.g. 9 NPs in A&N, 11 in Madhya Pradesh). This deck therefore presents BOTH source-qualified figures and derives its own card count from the row-level inventory rather than asserting a single live national total.',
    excluded: 'Sikhna Jwhwlao (Assam) — the available Assam document is an explicitly PRELIMINARY notification, so it is NOT counted as a finalised National Park.'
  },

  sanctuaries: {
    n: 574,
    date: 'Feb 2025',
    source: 'WII National Wildlife Database — Wildlife Sanctuaries',
    note: 'National aggregate. The deck carries a curated high-value study subset, not all 574.'
  },

  tigerReserves: {
    n: 58,
    date: 'Mar 2025',
    source: 'NTCA',
    note: '58th = Madhav Tiger Reserve, Madhya Pradesh (notified March 2025). 57th = Ratapani (MP, Dec 2024); 56th = Guru Ghasidas–Tamor Pingla (Chhattisgarh, 2024). Madhya Pradesh has nine — the most of any state.'
  },

  tigers: {
    n: 3682,
    date: 'AITE 2022',
    source: 'All India Tiger Estimation 2022 (NTCA / WII)',
    note: 'Roughly three-quarters of the world\'s wild tigers.'
  },

  riverDolphins: {
    n: 6327,
    date: '2024 survey',
    source: 'Population Status of River Dolphins in India 2024 (WII / Project Dolphin)',
    note: '6,324 Ganges river dolphins + 3 Indus river dolphins. UP highest (2,397), then Bihar (2,220).'
  },
};


/* ===== RAMSAR SITES ===== */
const RAMSAR=[
{id:'r1',name:'Chilika Lake',state:'Odisha',district:'Puri / Khordha / Ganjam',cluster:'East Coast',basin:'Coastal — Daya River / Bay of Bengal',year:1981,type:'Brackish coastal lagoon (~1,165 km²)',species:'Irrawaddy dolphin, greater flamingo, migratory waterfowl',hook:"One of India's two FIRST Ramsar Sites (1981), designated alongside Keoladeo. Among the largest brackish coastal lagoons in Asia. Holds India's only LAGOON population of Irrawaddy dolphin. Nalbana Bird Sanctuary is its core zone. Placed on the Montreux Record in 1993 for siltation and REMOVED in 2002 after restoration.",trap:"Irrawaddy dolphins also occur in the Sundarbans — Chilika is not India's only habitat, only its lagoon stronghold. And Chilika is a LAGOON, not a lake in the freshwater sense: the largest freshwater lake is Wular.",montreux:false,also:['Nalbana Bird Sanctuary (core)']},
{id:'r2',name:'Keoladeo National Park',state:'Rajasthan',district:'Bharatpur',cluster:'Ganga Plain',basin:'Ganga — Gambhir & Banganga (Yamuna system)',year:1981,type:'Man-made seasonal freshwater marsh',species:'Sarus crane, painted stork, ~370 bird species',hook:"Co-first Ramsar Site with Chilika (1981). UNESCO World Heritage Site. ON THE MONTREUX RECORD (water shortage / ecological change). Formerly a princely duck-shooting reserve at Bharatpur. Simultaneously a National Park, a Ramsar Site and a WHS.",trap:"The Siberian crane once wintered here but has not been reliably recorded for decades — a statement saying it 'is found' here is false.",montreux:true,unesco:true,also:['National Park']},
{id:'r3',name:'Upper Ganga River (Brijghat–Narora)',state:'Uttar Pradesh',district:'Bulandshahr / Amroha',cluster:'Ganga Plain',basin:'Ganga (main stem)',year:2005,type:'River stretch, ~265.9 km²',species:'Ganges river dolphin, gharial, Indian skimmer, smooth-coated otter',hook:"India's only RIVER-STRETCH Ramsar Site — the wetland is a length of the Ganga itself, not a lake. Runs from Brijghat to Narora. Important Bird Area for the Indian skimmer.",trap:'',montreux:false},
{id:'r4',name:'Kanwar (Kabar) Taal',state:'Bihar',district:'Begusarai',cluster:'Ganga Plain',basin:'Ganga — Burhi Gandak',year:2020,type:'Oxbow lake / residual floodplain lake',species:'Lesser adjutant, greylag & bar-headed goose',hook:"Bihar's first Ramsar Site. Among the largest freshwater oxbow lakes in the Indo-Gangetic plain. Formed by a meander cut-off of the Burhi Gandak. Also written Kabartal.",trap:'',montreux:false},
{id:'r5',name:'Nawabganj Bird Sanctuary',state:'Uttar Pradesh',district:'Unnao',cluster:'Ganga Plain',basin:'Ganga',year:2019,type:'Shallow monsoon-fed marsh',species:'Sarus crane, painted stork, bar-headed goose',hook:'Monsoon-dependent marsh between Lucknow and Kanpur. Central Asian Flyway stopover. Also a Bird Sanctuary under WPA.',trap:'',montreux:false,also:['Wildlife Sanctuary']},
{id:'r6',name:'Parvati Arga Bird Sanctuary',state:'Uttar Pradesh',district:'Gonda',cluster:'Ganga Plain',basin:'Ganga — Ghaghara',year:2019,type:'Two permanent oxbow lakes',species:'Greylag goose, northern pintail, common pochard',hook:'A pair of permanent oxbow lakes on the Ghaghara floodplain. Central Asian Flyway node.',trap:'',montreux:false,also:['Wildlife Sanctuary']},
{id:'r7',name:'Saman Bird Sanctuary',state:'Uttar Pradesh',district:'Mainpuri',cluster:'Ganga Plain',basin:'Ganga',year:2019,type:'Seasonal oxbow lake',species:'Sarus crane, bar-headed goose, painted stork',hook:'Seasonal floodplain lake supporting one of the notable sarus crane concentrations in Uttar Pradesh.',trap:'',montreux:false,also:['Wildlife Sanctuary']},
{id:'r8',name:'Samaspur Bird Sanctuary',state:'Uttar Pradesh',district:'Raebareli',cluster:'Ganga Plain',basin:'Ganga — Sai',year:2019,type:'Perennial lowland marsh',species:'Purple heron, painted stork, whiskered tern',hook:'Perennial marsh in the Sai sub-basin supporting stork and heron nesting colonies.',trap:'',montreux:false,also:['Wildlife Sanctuary']},
{id:'r9',name:'Sandi Bird Sanctuary',state:'Uttar Pradesh',district:'Hardoi',cluster:'Ganga Plain',basin:'Ganga — Garra',year:2019,type:'Freshwater marsh',species:'Sarus crane, northern shoveler, gadwall',hook:'Monsoon-dependent freshwater marsh on the Garra, a Ganga tributary.',trap:'',montreux:false,also:['Wildlife Sanctuary']},
{id:'r10',name:'Sarsai Nawar Jheel',state:'Uttar Pradesh',district:'Etawah',cluster:'Ganga Plain',basin:'Ganga — Yamuna system',year:2019,type:'Permanent marsh (jheel)',species:'Sarus crane, ferruginous duck, lesser adjutant',hook:'Permanent jheel supporting sarus crane breeding and several globally threatened waterbirds.',trap:'',montreux:false},
{id:'r11',name:'Sur Sarovar (Keetham Lake)',state:'Uttar Pradesh',district:'Agra',cluster:'Ganga Plain',basin:'Ganga — Yamuna',year:2020,type:'Man-made reservoir',species:'Bar-headed goose, painted stork, Indian grey pelican',hook:'Man-made lake near Agra, also called Keetham Lake. The Agra Bear Rescue Facility for rescued dancing sloth bears adjoins it.',trap:'',montreux:false,also:['Wildlife Sanctuary']},

{id:'w11',name:'Kedarnath Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Uttarakhand',district:'Rudraprayag / Chamoli',species:'Himalayan musk deer, snow leopard, Himalayan tahr, monal',ecology:'Temperate and alpine Himalayan forest and meadow',river:'Ganga — Mandakini and Alaknanda',hook:'The largest protected area of the western Himalaya in Uttarakhand and a key musk deer sanctuary, with a musk deer breeding centre at Kanchula Kharak.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w12',name:'Kishanpur Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Uttar Pradesh',district:'Lakhimpur Kheri',species:'Swamp deer (wet-ground barasingha), tiger, hispid hare',ecology:'TERAI grassland, sal forest and the Jhadi Taal wetland — lowland, not montane',river:'Ganga — Sharda',hook:'Part of DUDHWA TIGER RESERVE along with Dudhwa NP and Katarniaghat. The Jhadi Taal wetland holds a large WET-GROUND swamp deer herd.',trap:'Kishanpur is a LOWLAND TERAI sanctuary and a classic distractor in musk deer questions — musk deer are high-altitude Himalayan animals.',designations:['Wildlife Sanctuary','Part of Dudhwa Tiger Reserve']},
{id:'w13',name:'Katarniaghat Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Uttar Pradesh',district:'Bahraich',species:'Gharial, Ganges river dolphin, tiger, swamp deer',ecology:'Terai sal forest and the Girwa river',river:'Ganga — Girwa (Karnali / Ghaghara)',hook:'One of the few places where GHARIAL and GANGES RIVER DOLPHIN occur in the same stretch. Forms the Katarniaghat–Bardia corridor into Nepal. Part of Dudhwa Tiger Reserve.',trap:'',designations:['Wildlife Sanctuary','Part of Dudhwa Tiger Reserve']},
{id:'w14',name:'Pobitora Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Assam',district:'Morigaon',species:'Greater one-horned rhinoceros, wild buffalo, leopard',ecology:'Brahmaputra floodplain grassland and beels, ~38 km²',river:'BRAHMAPUTRA',hook:'A very small sanctuary carrying an exceptionally high density of GREATER ONE-HORNED RHINOCEROS. Rhinos from here have been used to restock other sites.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w15',name:'Chakrashila Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Assam',district:'Kokrajhar / Dhubri',species:'Golden langur, Gangetic dolphin in the adjoining river',ecology:'Semi-evergreen hill forest with the Dipor and Diplai beels',river:'Brahmaputra — Aie',hook:"India's first sanctuary declared with the GOLDEN LANGUR as its flagship, and a notable community-led conservation story. The golden langur occurs only between the Manas and Sankosh rivers in India and adjoining Bhutan.",trap:'',designations:['Wildlife Sanctuary']},
{id:'w16',name:'Sathyamangalam Tiger Reserve',paType:'Tiger Reserve (over a Wildlife Sanctuary)',state:'Tamil Nadu',district:'Erode',species:'Tiger, Asian elephant, gaur, four-horned antelope',ecology:'Dry and moist deciduous forest of the Eastern–Western Ghats junction',river:'CAUVERY — Bhavani and Moyar',hook:'The largest protected area in Tamil Nadu, forming the critical land bridge between the Western and Eastern Ghats. Drained by the BHAVANI and MOYAR into the CAUVERY.',trap:'',designations:['Wildlife Sanctuary','Tiger Reserve','Elephant Reserve']},
{id:'w17',name:'Wayanad Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Kerala',district:'Wayanad',species:'Asian elephant, tiger, gaur, dhole',ecology:'Moist and dry deciduous forest of the Wayanad plateau',river:'CAUVERY — Kabini',hook:'Contiguous with Bandipur, Nagarhole and Mudumalai, forming the Nilgiri elephant landscape. Drained by the KABINI into the CAUVERY.',trap:'',designations:['Wildlife Sanctuary','Nilgiri Biosphere Reserve','Project Elephant Reserve']},
{id:'w18',name:'Kalakad Mundanthurai Tiger Reserve',paType:'Tiger Reserve',state:'Tamil Nadu',district:'Tirunelveli / Kanyakumari',species:'Lion-tailed macaque, tiger, Nilgiri tahr, Nilgiri langur',ecology:'Tropical wet evergreen forest of the Agasthyamalai hills',river:'Tamiraparani',hook:"Tamil Nadu's first Tiger Reserve (1988), sometimes called the river sanctuary for its role in the Tamiraparani catchment. A CORE COMPONENT OF THE AGASTHYAMALAI BIOSPHERE RESERVE.",trap:'Agasthyamalai Biosphere Reserve comprises NEYYAR, PEPPARA and SHENDURNEY Wildlife Sanctuaries together with KALAKAD MUNDANTHURAI Tiger Reserve — not the Nilgiri or Eastern Ghats sites.',designations:['Tiger Reserve','Agasthyamalai Biosphere Reserve']},
{id:'w19',name:'Neyyar Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Kerala',district:'Thiruvananthapuram',species:'Lion-tailed macaque, Nilgiri tahr, elephant, sloth bear',ecology:'Western Ghats evergreen and semi-evergreen forest around the Neyyar reservoir',river:'Neyyar',hook:'One of the three Kerala sanctuaries — with PEPPARA and SHENDURNEY — that form the AGASTHYAMALAI BIOSPHERE RESERVE alongside Kalakad Mundanthurai Tiger Reserve. Agastya Mala peak lies in this cluster.',trap:'',designations:['Wildlife Sanctuary','Agasthyamalai Biosphere Reserve']},
{id:'w20',name:'Peppara Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Kerala',district:'Thiruvananthapuram',species:'Elephant, lion-tailed macaque, sambar',ecology:'Western Ghats forest around the Peppara reservoir on the Karamana river',river:'Karamana',hook:'Protects the catchment supplying drinking water to Thiruvananthapuram. One of the four components of the AGASTHYAMALAI BIOSPHERE RESERVE.',trap:'',designations:['Wildlife Sanctuary','Agasthyamalai Biosphere Reserve']},
{id:'w21',name:'Shendurney Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Kerala',district:'Kollam',species:'Lion-tailed macaque, Nilgiri langur, elephant',ecology:'Tropical evergreen forest, named after the endemic tree Gluta travancorica',river:'Kallada (which feeds Ashtamudi)',hook:'The fourth component of the AGASTHYAMALAI BIOSPHERE RESERVE, on the Kallada catchment above Ashtamudi. The Kani tribal community here is central to the Jeevani benefit-sharing case.',trap:'',designations:['Wildlife Sanctuary','Agasthyamalai Biosphere Reserve']},
{id:'w22',name:'Srivilliputhur Grizzled Giant Squirrel Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Tamil Nadu',district:'Virudhunagar / Madurai',species:'Grizzled giant squirrel, lion-tailed macaque, tiger',ecology:'Riparian and deciduous forest of the southern Western Ghats',river:'Vaippar / Vaigai headwaters',hook:"The only Indian sanctuary NAMED FOR the GRIZZLED GIANT SQUIRREL. It forms the Srivilliputhur–Megamalai Tiger Reserve, Tamil Nadu's fifth, notified in 2021.",trap:'The grizzled giant squirrel is NOT restricted to this sanctuary — it also occurs in Chinnar WLS (Kerala), Cauvery WLS (Karnataka) and the Anamalai landscape.',designations:['Wildlife Sanctuary','Part of Srivilliputhur–Megamalai Tiger Reserve']},
{id:'w23',name:'Rollapadu Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh',district:'Kurnool',species:'Great Indian bustard, lesser florican, blackbuck, Indian wolf',ecology:'Deccan short-grass plain',river:'Krishna basin',hook:'A rare protected GRASSLAND of the Deccan, created chiefly for the Great Indian Bustard. Illustrates the neglect of grasslands, long classified as wasteland in Indian land records.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w24',name:'Chandaka–Dampara Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Odisha',district:'Khordha / Cuttack',species:'Asian elephant, chital, pangolin',ecology:'Moist deciduous forest on the Eastern Ghats edge near Bhubaneswar',river:'Kuakhai / Mahanadi system',hook:'An elephant sanctuary on the edge of Bhubaneswar, illustrating peri-urban elephant–human conflict. The Nandankanan Zoological Park lies within this landscape.',trap:'NANDANKANAN IS A ZOOLOGICAL PARK, not a wildlife sanctuary. Zoos are regulated by the Central Zoo Authority — do not treat a zoo as a protected area.',designations:['Wildlife Sanctuary']},
{id:'w25',name:'Kibber Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Himachal Pradesh',district:'Lahaul & Spiti',species:'Snow leopard, bharal (blue sheep), Tibetan wolf, ibex',ecology:'Trans-Himalayan cold desert above 4,000 m, almost treeless',river:'Indus — Spiti',hook:'A cold-desert sanctuary in Spiti known for reliable SNOW LEOPARD presence and for community-based conservation using livestock insurance and homestays to offset predation losses.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w26',name:'Changthang Cold Desert Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Ladakh',district:'Leh',species:'Kiang (Tibetan wild ass), black-necked crane, Tibetan argali, snow leopard',ecology:'High-altitude cold desert plateau with brackish lakes above 4,000 m',river:'Endorheic plateau lakes; Indus catchment margins',hook:'Encloses TSOMORIRI and TSO KAR, both Ramsar Sites. The only Indian breeding ground of the BLACK-NECKED CRANE and the range of the KIANG.',trap:'Kiang (Equus kiang) is the TIBETAN wild ass of Ladakh — distinct from the khur (Equus hemionus khur) of the Little Rann of Kachchh.',designations:['Wildlife Sanctuary','Contains two Ramsar Sites']},
{id:'w27',name:'Bhitarkanika Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Odisha',district:'Kendrapara',species:'Saltwater crocodile, king cobra, olive ridley offshore',ecology:'Mangrove and estuarine creeks of the Brahmani–Baitarani delta',river:'Brahmani, Baitarani, Dhamra',hook:'The wider sanctuary within which the smaller Bhitarkanika National Park sits — three nested designations (Sanctuary, National Park, Ramsar Site) over one landscape.',trap:'',designations:['Wildlife Sanctuary','Contains National Park','Ramsar Site']},
{id:'w28',name:'Parambikulam Tiger Reserve',paType:'Tiger Reserve',state:'Kerala',district:'Palakkad',species:'Tiger, gaur, lion-tailed macaque, Nilgiri tahr',ecology:'Moist deciduous and evergreen Western Ghats forest',river:'Chalakudy and Cauvery-side catchments',hook:'Holds Kannimara, one of the largest living teak trees in the world. Well known for tribal community participation, with Kadar and Malasar communities involved in reserve management.',trap:'',designations:['Tiger Reserve','Wildlife Sanctuary']},
{id:'w29',name:'Periyar Tiger Reserve',paType:'Tiger Reserve',state:'Kerala',district:'Idukki / Pathanamthitta',species:'Tiger, Asian elephant, lion-tailed macaque, Nilgiri tahr',ecology:'Evergreen and semi-evergreen Western Ghats forest around an artificial lake',river:'PERIYAR (dammed at Mullaperiyar)',hook:'Built around the Periyar (Thekkady) lake created by the Mullaperiyar dam in 1895. Internationally cited for its ex-poacher ecodevelopment programme.',trap:'',designations:['Tiger Reserve','National Park (core)','Elephant Reserve']},
{id:'w30',name:'Keshopur-Miani Community Reserve',paType:'COMMUNITY RESERVE',state:'Punjab',district:'Gurdaspur',species:'Common crane, bar-headed goose, waterfowl',ecology:'Seasonal marsh on village common land',river:'Indus — Beas',hook:'One of the clearest Indian examples of the COMMUNITY RESERVE category introduced by the 2002 amendment to the Wild Life (Protection) Act — community or private land, conserved with community consent, and also a Ramsar Site.',trap:'A Community Reserve is declared over community or private land. It is NOT government-owned land, unlike a National Park. It is governed by a Community Reserve Management Committee, not the Chief Wildlife Warden.',designations:['Community Reserve','Ramsar Site']},
{id:'w31',name:'Asola Bhatti Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Delhi / Haryana',district:'South Delhi, Faridabad, Gurugram',species:'Leopard, striped hyena, golden jackal, nilgai',ecology:'Northern terminal ridge of the Aravallis, thorn scrub',river:'Yamuna catchment',hook:"Protects the northernmost extension of the ARAVALLI range at the edge of Delhi and is the capital's principal remaining wildlife habitat. Leopards have recolonised it in recent years.",trap:'',designations:['Wildlife Sanctuary']},
{id:'w32',name:'Chinnar Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Kerala',district:'Idukki',species:'Grizzled giant squirrel, Nilgiri tahr, Indian star tortoise',ecology:'RAIN-SHADOW thorn and dry deciduous forest — unusual for Kerala',river:'Chinnar / Pambar (Cauvery side)',hook:"One of the few DRY, rain-shadow protected areas in Kerala, on the leeward side of the Western Ghats. A significant habitat of the GRIZZLED GIANT SQUIRREL alongside Srivilliputhur.",trap:'',designations:['Wildlife Sanctuary']},
{id:'w33',name:'Nagarjunsagar–Srisailam Tiger Reserve',paType:'Tiger Reserve',state:'Andhra Pradesh & Telangana',district:'Nallamala hills',species:'Tiger, leopard, mugger, Indian pangolin',ecology:'Dry deciduous Nallamala hill forest around the Krishna gorge',river:'KRISHNA',hook:"THE LARGEST TIGER RESERVE IN INDIA by total area, and the one with the LARGEST CRITICAL TIGER HABITAT. Spans two states across the Nallamala hills. Home of the Chenchu people.",trap:'For "largest area under Critical Tiger Habitat", the answer is Nagarjunsagar–Srisailam — not Corbett, Ranthambore or Sundarbans.',designations:['Tiger Reserve','Wildlife Sanctuary','Project Tiger']},
{id:'w34',name:'Dachigam National Park',paType:'National Park',state:'Jammu & Kashmir',district:'Srinagar / Ganderbal',species:'Hangul (Kashmir stag), Himalayan black bear, musk deer',ecology:'Temperate broadleaf and coniferous forest and alpine pasture, Zabarwan range',river:'Dagwan stream feeding Dal Lake',hook:"The last significant refuge of the HANGUL or Kashmir stag, the state animal of Jammu & Kashmir. 'Dachigam' means ten villages, relocated when the area was protected to safeguard Srinagar's water supply.",trap:"Dachigam is a NATIONAL PARK (since 1981), not a Wildlife Sanctuary. Hangul numbers have recovered from a 1970s low to roughly 260–290 in recent counts — '<130' reflects an older trough.",designations:['National Park']},
