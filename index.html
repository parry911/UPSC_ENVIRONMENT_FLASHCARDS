{id:'v1',dir:'Species → Protected Area',cue:'A subspecies of Indian swamp deer that thrives on HARD GROUND and is exclusively GRAMINIVOROUS is conserved at which protected area?',answer:'Kanha National Park',state:'Madhya Pradesh',hook:'Hard-ground barasingha (Rucervus duvaucelii branderi) survives in the wild only in Kanha. Manas, Mudumalai and Tal Chhapar are the usual distractors — none holds it.'},
{id:'v2',dir:'Species → Protected Area',cue:"India's only ape, listed as ENDANGERED by the IUCN, is associated with which north-east Indian sanctuary?",answer:'Hollongapar Gibbon Wildlife Sanctuary, Jorhat',state:'Assam',hook:'Western hoolock gibbon. Note the build: light-bodied, long-armed, brachiating — nothing like a gorilla.'},
{id:'v3',dir:'Species → Protected Area',cue:'Which two of these are the most likely places to find MUSK DEER in natural habitat — Askot WLS, Gangotri NP, Kishanpur WLS, Manas NP?',answer:'Askot Wildlife Sanctuary and Gangotri National Park',state:'Uttarakhand',hook:'Musk deer are high-altitude Himalayan animals. Kishanpur is lowland terai in UP and Manas sits in the Brahmaputra foothills — both are far too low.'},
{id:'v4',dir:'Species → Protected Area',cue:'The SANGAI or brow-antlered deer is found only at which national park?',answer:'Keibul Lamjao National Park, on Loktak Lake',state:'Manipur',hook:"The world's only floating national park. The sangai lives on phumdis — floating mats of vegetation."},
{id:'v5',dir:'Species → Protected Area',cue:'Which national park is spread over two districts, contains human habitation, and is a natural habitat of the GREAT INDIAN BUSTARD?',answer:'Desert National Park',state:'Rajasthan (Jaisalmer and Barmer)',hook:'Two districts — true. GIB habitat — true. No human habitation inside — FALSE; villages and grazing persist within the park.'},
{id:'v6',dir:'Species → Protected Area',cue:'The ASIATIC LION survives in the wild only in which landscape?',answer:'The Gir landscape of Saurashtra',state:'Gujarat',hook:'Gir National Park (~259 km²) plus Gir Wildlife Sanctuary (~1,153 km²) and satellite areas. About 891 lions in the 2025 estimation, many now living outside protected areas.'},
{id:'v7',dir:'Species → Protected Area',cue:'The HANGUL or Kashmir stag is confined to which protected area?',answer:'Dachigam National Park',state:'Jammu & Kashmir',hook:'Note that Dachigam is a NATIONAL PARK, not a sanctuary. Recent counts put the hangul at roughly 260–290.'},
{id:'v8',dir:'Species → Protected Area',cue:'Which sanctuary was declared specifically for the GANGES RIVER DOLPHIN?',answer:'Vikramshila Gangetic Dolphin Sanctuary, Bhagalpur',state:'Bihar',hook:"India's only protected area declared for the dolphin, notified 1991 over a 60 km stretch of the Ganga. The 2024 survey recorded 6,324 Ganges river dolphins nationally."},
{id:'v9',dir:'Species → Protected Area',cue:'Where do GHARIAL, MUGGER and GANGES RIVER DOLPHIN occur together?',answer:'National Chambal Sanctuary',state:'MP, Rajasthan and UP',hook:'A tri-state sanctuary over one river. Also holds the Indian skimmer and the red-crowned roofed turtle.'},
{id:'v10',dir:'Basin → Protected Areas',cue:'Which protected areas lie in the CAUVERY BASIN — Nagarhole, Papikonda, Sathyamangalam, Wayanad?',answer:'Nagarhole, Sathyamangalam and Wayanad',state:'Karnataka, Tamil Nadu, Kerala',hook:'All three drain through the Kabini, Bhavani or Moyar into the Cauvery. PAPIKONDA is on the GODAVARI in Andhra Pradesh and is the odd one out.'},
{id:'v11',dir:'Landscape → Components',cue:'Which protected areas make up the AGASTHYAMALAI Biosphere Reserve?',answer:'Neyyar, Peppara and Shendurney Wildlife Sanctuaries, plus Kalakad Mundanthurai Tiger Reserve',state:'Kerala and Tamil Nadu',hook:'The southernmost Western Ghats cluster. Do not confuse with the Nilgiri set — Mudumalai, Sathyamangalam, Wayanad and Silent Valley.'},
{id:'v12',dir:'Ecology → Protected Area',cue:'Which national park lies COMPLETELY within the temperate alpine zone?',answer:'Valley of Flowers National Park',state:'Uttarakhand (Chamoli district)',hook:'Manas, Namdapha and Neora Valley all extend into subtropical or tropical forest at lower elevations. Only Valley of Flowers is wholly alpine.'},
{id:'v13',dir:'Superlative → Protected Area',cue:'Which Tiger Reserve has the LARGEST AREA UNDER CRITICAL TIGER HABITAT?',answer:'Nagarjunsagar–Srisailam Tiger Reserve',state:'Andhra Pradesh and Telangana',hook:'Corbett, Ranthambore and Sundarbans are the standard distractors. Nagarjunsagar–Srisailam is also the largest tiger reserve overall.'},
{id:'v14',dir:'Wetland → State',cue:'Match: Hokera Wetland, Renuka Wetland, Rudrasagar Lake, Sasthamkotta Lake.',answer:'Hokera → Jammu & Kashmir · Renuka → Himachal Pradesh · Rudrasagar → Tripura · Sasthamkotta → Kerala',state:'Four states',hook:'The two traps in this classic pairing set are HOKERA, which is in Jammu & Kashmir and NOT Punjab, and SASTHAMKOTTA, which is in Kerala and NOT Tamil Nadu. Renuka–HP and Rudrasagar–Tripura are correct as given.'},
{id:'v15',dir:'Species → River',cue:'Match: Blue-finned mahseer, Irrawaddy dolphin, Rusty-spotted cat.',answer:'Blue-finned mahseer → Cauvery (correct) · Irrawaddy dolphin → Chilika, NOT Chambal · Rusty-spotted cat → Eastern Ghats (correct)',state:'Multiple',hook:'The Irrawaddy dolphin pairing is the false one — the Chambal holds the GANGES river dolphin. Mahseer–Cauvery and rusty-spotted cat–Eastern Ghats both hold.'},
{id:'v16',dir:'Site → Multiple designations',cue:'Which Ramsar Site lies inside a national park that became a Tiger Reserve in 2025?',answer:'Sakhya Sagar, inside Madhav National Park',state:'Madhya Pradesh (Shivpuri)',hook:"Madhav National Park was notified as India's 58th Tiger Reserve in March 2025. The park lies entirely in Shivpuri district, MP — it is not shared with Rajasthan."},
{id:'v17',dir:'Site → State',cue:'Which state received its FIRST Ramsar Site with the designation of Glaw Lake in August 2026?',answer:'Arunachal Pradesh',state:'Arunachal Pradesh (Lohit district)',hook:"India's 101st Ramsar Site. Glaw Lake lies inside Kamlang Tiger Reserve and Wildlife Sanctuary, with over 150 tree species and 49 orchids recorded in the site and catchment."},
{id:'v18',dir:'Ecology → Species',cue:'An arboreal, carnivorous ARACHNID confined to a small forest area in India — what is it?',answer:'Gooty or Peacock tarantula (Poecilotheria metallica)',state:'Andhra Pradesh / Telangana (Eastern Ghats)',hook:'Three checks: arachnid not crustacean; carnivorous not omnivorous; arboreal, living in tree hollows rather than ground burrows.'},
{id:'v19',dir:'Ecology → Species',cue:'Which of these are nocturnal or most active after sunset — lion-tailed macaque, Malabar civet, sambar?',answer:'Malabar civet and sambar — the lion-tailed macaque is DIURNAL',state:'Western Ghats',hook:'Primates are generally diurnal; the exception in India is the slender and slow loris. Civets are nocturnal, and sambar are chiefly nocturnal-crepuscular.'},
{id:'v20',dir:'Legal → Implication',cue:'A plant species is placed under SCHEDULE VI of the Wild Life (Protection) Act. What follows?',answer:'A licence is required to cultivate that plant',state:'India-wide',hook:'Schedule VI covers specified plants. Cultivation is REGULATED through licensing, not prohibited outright. It carries no implication of genetic modification or invasiveness.'},
{id:'v21',dir:'Legal → Authority',cue:'Once an area is notified as a COMMUNITY RESERVE, who governs it and what is permitted?',answer:'A Community Reserve Management Committee governs it. Hunting is prohibited; NTFP collection and traditional agriculture continue.',state:'India-wide',hook:'The Chief Wildlife Warden does NOT become the governing authority — that is the standard trap. The category applies to community or private land, introduced by the 2002 amendment.'},
{id:'v22',dir:'Site → Feature',cue:'Which Ramsar Site is a meteorite impact crater lake that is both saline and alkaline?',answer:'Lonar Lake, Buldhana district',state:'Maharashtra',hook:'Formed by a hypervelocity impact into Deccan basalt — a rare setting. It is an impact crater, not a volcanic one, despite the basaltic surroundings.'},
{id:'v23',dir:'Superlative → Site',cue:'Name the largest freshwater lake, the largest inland saline wetland, the largest brackish lagoon and the longest lake in India.',answer:'Wular (freshwater) · Sambhar (inland saline) · Chilika (brackish lagoon) · Vembanad (longest)',state:'J&K, Rajasthan, Odisha, Kerala',hook:'All four are Ramsar Sites. Wular and Keoladeo and Loktak matter separately for the Montreux Record — Keoladeo, Loktak and Wular are the Indian sites flagged there over time.'},
{id:'v24',dir:'Species → Status',cue:'Which of these are NOT Endangered or Critically Endangered — Great Indian Bustard, Indian wild ass, gharial, pygmy hog?',answer:'The INDIAN WILD ASS is only Near Threatened; the other three are CR or EN',state:'Multiple',hook:'GIB = CR. Gharial = CR. Pygmy hog = EN. Indian wild ass (Equus hemionus) = NT after a strong recovery in the Little Rann.'},
{id:'v25',dir:'Ecology → Species',cue:'An EPIPHYTIC orchid that is the state flower of BOTH Assam and Arunachal Pradesh — but is NOT endemic to north-east India. Name it.',answer:'Foxtail Orchid (Rhynchostylis retusa), Kopou Phool',state:'North-east India and wider tropical Asia',hook:'Epiphytic: true. State flower of Assam AND Arunachal Pradesh: true. Endemic to north-east India: FALSE — it ranges across Sri Lanka, Nepal, Bhutan, Myanmar, China and South-East Asia. Worn by Bihu dancers.'},
{id:'v26',dir:'Legal → Diet',cue:'Which mammal was historically listed as VERMIN under the Wild Life (Protection) Act — and what does it actually eat?',answer:'Indian Flying Fox (Pteropus giganteus) — it is FRUGIVOROUS and NECTARIVOROUS, not a blood-feeder',state:'India-wide',hook:'Two separate propositions. Its historical Schedule V vermin listing is true. But it is a fruit bat that eats fruit, nectar and pollen. Only three vampire bat species drink blood and all live in the Americas. So a "because it feeds on blood" explanation is false.'},
{id:'v27',dir:'Behaviour → Species',cue:'Indian palm squirrels: do they nest by burrowing in the ground, store food in the ground, and eat an omnivorous diet?',answer:'They nest in TREES (not ground burrows); they DO scatter-hoard food in the ground; they ARE omnivorous — so only the last two hold',state:'India-wide',hook:'Funambulus species are arboreal, nesting in tree hollows and leafy drays. They scatter-hoard nuts and seeds in shallow soil caches, making them significant seed dispersers. Their diet includes nuts, seeds, fruit, insects, eggs and small birds.'},
{id:'v28',dir:'Ecological role → Groups',cue:'Which of these groups contain PARASITOID species — carabid beetles, centipedes, flies, termites, wasps?',answer:'Carabid beetles, flies and wasps — centipedes and termites do not',state:'Global concept',hook:'A parasitoid develops on or in a single host and ultimately kills it — intermediate between a parasite and a predator. Parasitoidism is concentrated in Hymenoptera (wasps) and Diptera (flies), with some Coleoptera including carabids. Centipedes are free-living predators; termites are detritivorous social insects.'},
{id:'v29',dir:'Ecological role → Organisms',cue:'Which of these are DETRITIVORES — earthworms, jellyfish, millipedes, seahorses, woodlice?',answer:'Earthworms, millipedes and woodlice',state:'Global concept',hook:'Detritivores ingest decomposing organic matter directly. Earthworms, millipedes and woodlice all do. Jellyfish are carnivorous plankton predators and seahorses are carnivores taking small crustaceans. Note: detritivores INGEST detritus; decomposers such as fungi and bacteria break it down externally — the terms are not interchangeable.'},
{id:'v30',dir:'Ecological relationship → Groups',cue:'Which of these can form SYMBIOTIC relationships — cnidarians, fungi, protozoa?',answer:'All three',state:'Global concept',hook:'Cnidarians: reef-building corals host zooxanthellae (Symbiodinium) in an obligate mutualism. Fungi: mycorrhizae with plant roots, and lichens with algae or cyanobacteria. Protozoa: gut flagellates in termites digest cellulose for the host. Symbiosis includes mutualism, commensalism and parasitism.'},
{id:'v31',dir:'Legal → Authority',cue:'Under Indian wildlife law, are wild animals government property, and does protection extend outside protected areas?',answer:'Yes to both. Section 39 makes hunted or found-dead wild animals government property, and protection attaches to the SPECIES, so a Schedule I animal is equally protected inside and outside a PA.',state:'India-wide',hook:'The third common proposition is FALSE: mere APPREHENSION that an animal may become dangerous is NOT sufficient ground to capture or kill it. Section 11 requires that the animal has actually become dangerous to human life, or is disabled or diseased beyond recovery, and that it cannot be tranquillised or translocated.'},
{id:'v32',dir:'Chronology → Protected Area',cue:'Which National Park became a Tiger Reserve in 2025, contains a Ramsar Site, and lies wholly in one state?',answer:'Madhav National Park, Shivpuri district, Madhya Pradesh — India\'s 58th Tiger Reserve (March 2025), containing Sakhya Sagar Ramsar Site',state:'Madhya Pradesh',hook:'All three testable propositions resolve as: Tiger Reserve 2025 — TRUE. Sakhya Sagar Ramsar Site inside — TRUE. Area shared with Rajasthan — FALSE, it is entirely in Shivpuri district, MP.'},
{id:'v33',dir:'Ordinal → Ramsar Site',cue:'Which wetland took India past 100 Ramsar Sites, and which one is the 101st?',answer:'100th = Jai Prakash Narayan Bird Sanctuary (Surha Tal), Ballia, UP — June 2026. 101st = Glaw Lake, Lohit, Arunachal Pradesh — 3 Aug 2026.',state:'Uttar Pradesh; Arunachal Pradesh',hook:'Glaw Lake is Arunachal Pradesh\'s FIRST Ramsar Site and lies inside Kamlang Tiger Reserve and Wildlife Sanctuary, with over 150 tree species and 49 orchids recorded. State ordinals must always be dated — "India\'s latest Ramsar Site" is never a safe formulation.'},
{id:'v34',dir:'State first → Ramsar Site',cue:'Name the states that received their FIRST Ramsar Site in the 2025–26 designations.',answer:'Chhattisgarh (Kopra Jalashay), Sikkim (Khachoedpalri), Jharkhand (Udhwa Lake), Arunachal Pradesh (Glaw Lake)',state:'Four states',hook:'A high-yield current-affairs cluster. Note the naming and dating subtlety: the official Ramsar/RSIS site name is Khachoedpalri (Khecheopalri is the common local form), and RSIS gives its designation date as 15 July 2024 even though it was publicly announced with the 2025 group.'},
{id:'v35',dir:'Species → Rediscovery site',cue:'Which nocturnal bird, considered extinct since 1900, was rediscovered in 1986 in an Andhra Pradesh scrub sanctuary?',answer:"Jerdon's Courser (Rhinoptilus bitorquatus), at Sri Lankamalleswara Wildlife Sanctuary, Kadapa",state:'Andhra Pradesh',hook:'A nocturnal scrub-jungle bird endemic to a small belt of the Eastern Ghats in Andhra Pradesh. Pair it with the FOREST OWLET, rediscovered in 1997 in CENTRAL INDIA after 113 years — both are rediscovery cases, but in entirely different regions.'},
{id:'v36',dir:'State animal → Species',cue:'Match the state animal: Maharashtra, Manipur, Tamil Nadu, Meghalaya, Jammu & Kashmir.',answer:'Maharashtra → Indian giant squirrel (Shekru) · Manipur → Sangai · Tamil Nadu → Nilgiri tahr · Meghalaya → Clouded leopard · J&K → Hangul',state:'Five states',hook:'Note the geographic cross-over trap: the Nilgiri tahr is Tamil Nadu\'s state animal, but its largest population is in Eravikulam National Park in KERALA. Bhimashankar WLS (Maharashtra) was declared specifically for the Shekru.'},
{id:'v37',dir:'Reserve → Community rights',cue:'In which Tiger Reserve did a tribal community first secure Forest Rights Act community rights inside the reserve?',answer:'Biligiri Rangaswamy Temple (BRT) Tiger Reserve — the Soliga community',state:'Karnataka (Chamarajanagar)',hook:'BRT is also the critical forest bridge between the Eastern and Western Ghats, and lies in the CAUVERY BASIN. Pair with Periyar\'s ex-poacher programme and Bhadra\'s voluntary village relocation as the three standard Indian community-conservation case studies.'},
{id:'v38',dir:'Habitat clue → Species',cue:'A wetland-dependent small wild cat with partially webbed feet that scoops fish from water — name it and give its correct IUCN status.',answer:'Fishing Cat (Prionailurus viverrinus) — VULNERABLE, not Endangered',state:'Sundarbans, Chilika, Coringa, terai',hook:'Downlisted to Vulnerable in the 2016 IUCN reassessment. State animal of West Bengal. Aquaculture conversion and wetland reclamation are the primary threats.'},
{id:'v39',dir:'Superlative → Reserve',cue:'Which is the largest Wildlife Sanctuary in India, and which is the largest Tiger Reserve?',answer:'Largest WLS = Kachchh Desert WLS, Gujarat (~7,506 km²). Largest Tiger Reserve = Nagarjunsagar–Srisailam (AP & Telangana).',state:'Gujarat; Andhra Pradesh & Telangana',hook:'Nagarjunsagar–Srisailam also holds the largest Critical Tiger Habitat. Kachchh Desert WLS contains Flamingo City, the only regular greater flamingo breeding colony in India.'},
{id:'v40',dir:'Taxonomy → Distinction',cue:'Which of the four large cats of Namdapha is NOT in genus Panthera?',answer:'The clouded leopard — Neofelis nebulosa',state:'Arunachal Pradesh',hook:'Namdapha supports tiger, leopard, snow leopard and clouded leopard. Only the first three are Panthera. The same trap applies to the Kamlang landscape around Glaw Lake, which also holds all four.'},
];

/* ============================================================
   APP LOGIC — ACTIVE RECALL ARCHITECTURE

   FRONT RENDERING IS SPLIT BY CARD TYPE:
     frontMode:'name'     → ordinary entity cards.
                            Front shows ONLY the entity name.
                            No badge, no state, no district, no cue,
                            no subtitle, no species, no designation.
     frontMode:'question' → concept/law and reverse-retrieval cards.
                            Front shows a precise recall question or clue.

   The old cBadge / cCue / cSub elements have been REMOVED from the
   DOM, not merely hidden — see the card-face markup above.

   National totals live in CURRENT (metadata).
   Deck card counts are computed from data.length (data).
   The two are never conflated.
   ============================================================ */
let TAB='r', filtered=[], idx=0, flipped=false, reviewMode=false;
let scores={};
try{scores=JSON.parse(localStorage.getItem('upsc_v4_scores')||'{}');}catch(e){}

const TABS={
 r:{data:RAMSAR,color:'var(--r)',strat:'sr',label:'Ramsar',frontMode:'name',
   stratTitle:'Retrieve before you flip — state, district, basin, wetland type, designation date',
   stratBody:`The front gives you only the site name. Before flipping, generate: which state and district; which river or basin; what kind of wetland; roughly when it was designated; which species it is known for; and whether it carries any other designation. National reference: ${CURRENT.ramsar.n} Ramsar Sites as of ${CURRENT.ramsar.date}. Montreux Record: Keoladeo, Loktak and Wular. First sites (1981): Chilika and Keoladeo. Name traps to watch — Patna Bird Sanctuary is in UP not Bihar, Hokera is in J&K not Punjab, Sasthamkotta is in Kerala not Tamil Nadu.`,
   ff:'cluster',fl:'Filter by cluster',
   nameFn:d=>d.name,
   headerFn:d=>`${d.state.toUpperCase()} · DESIGNATED ${d.year} · ${d.cluster}`,
   factsFn:d=>[
     {k:'State / UT',v:d.state},
     {k:'District',v:d.district},
     {k:'Designated',v:d.year},
     {k:'Wetland type',v:d.type},
     {k:'River / basin',v:d.basin},
     {k:'Key species',v:d.species},
     {k:'Other designations',v:(d.also||[]).join(' · ')}],
   hookFn:d=>d.hook,trapFn:d=>d.trap,
   badgesFn:d=>'<span class="badge badge-ra">Ramsar Site</span>'+(d.montreux?'<span class="badge badge-mx">Montreux Record</span>':'')+(d.unesco?'<span class="badge badge-un">UNESCO WHS</span>':''),
   asOfFn:d=>`National reference: ${CURRENT.ramsar.n} Ramsar Sites as of ${CURRENT.ramsar.date} (${CURRENT.ramsar.source})`},

 n:{data:NP,color:'var(--n)',strat:'sn',label:'National Parks',frontMode:'name',
   stratTitle:'Retrieve before you flip — state, district, biome, basin, flagship species, designations',
   stratBody:`The front gives you only the park name. Before flipping, generate: state and district; biome or ecological zone; river or basin; flagship species; and every legal designation it carries — a park may simultaneously be a Tiger Reserve, a Ramsar Site, a Biosphere Reserve and a World Heritage Site. National Park area is not Tiger Reserve area. NOTE ON THE NATIONAL TOTAL: WII's aggregate page reports ${CURRENT.nationalParks.wiiAggregate} (last updated ${CURRENT.nationalParks.wiiDate}), while Odisha's official release of ${CURRENT.nationalParks.odishaDate} calls Similipal India's ${CURRENT.nationalParks.odishaOrdinal}th National Park. This deck preserves both source-qualified figures rather than asserting one settled number.`,
   ff:'state',fl:'Filter by state',
   nameFn:d=>d.name,
   headerFn:d=>`${d.state.toUpperCase()} · ${d.biome}`,
   factsFn:d=>[
     {k:'State / UT',v:d.state},
     {k:'District',v:d.district},
     {k:'Area',v:d.area},
     {k:'Biome / ecological zone',v:d.biome},
     {k:'River / basin',v:d.basin},
     {k:'Flagship species',v:d.flagship},
     {k:'Designations',v:(d.designations||[]).join(' · ')}],
   hookFn:d=>d.hook,trapFn:d=>d.trap,
   badgesFn:d=>'<span class="badge badge-np">National Park</span>'+(d.tigerReserve?'<span class="badge badge-tr">Tiger Reserve</span>':'')+(d.unesco?'<span class="badge badge-un">UNESCO WHS</span>':''),
   asOfFn:d=>`National totals disputed: WII ${CURRENT.nationalParks.wiiAggregate} (${CURRENT.nationalParks.wiiDate}) vs Odisha "${CURRENT.nationalParks.odishaOrdinal}th" (${CURRENT.nationalParks.odishaDate}) — see Quick Facts`},

 w:{data:WLS,color:'var(--w)',strat:'sw',label:'Sanctuaries & Reserves',frontMode:'name',
   stratTitle:'Retrieve before you flip — legal category first, then species, state, basin',
   stratBody:`The front gives you only the name. Before flipping, generate: the EXACT legal category — Wildlife Sanctuary, National Park, Tiger Reserve, Conservation Reserve or Community Reserve are five distinct statutory categories with different rules and different governing authorities. Then state and district, flagship species, ecology and basin. National reference: ${CURRENT.sanctuaries.n} Wildlife Sanctuaries (${CURRENT.sanctuaries.date}) and ${CURRENT.tigerReserves.n} Tiger Reserves (${CURRENT.tigerReserves.date}). This tab is a curated study subset, not the full national inventory.`,
   ff:'state',fl:'Filter by state',
   nameFn:d=>d.name,
   headerFn:d=>`${d.state.toUpperCase()} · ${d.paType}`,
   factsFn:d=>[
     {k:'Legal category',v:d.paType},
     {k:'State / UT',v:d.state},
     {k:'District',v:d.district},
     {k:'Key species',v:d.species},
     {k:'Ecology',v:d.ecology},
     {k:'River / basin',v:d.river},
     {k:'Designations',v:(d.designations||[]).join(' · ')}],
   hookFn:d=>d.hook,trapFn:d=>d.trap,
   badgesFn:d=>(d.designations||[]).map(x=>{
     const c = /Tiger Reserve/.test(x)?'badge-tr'
             : /National Park/.test(x)?'badge-np'
             : /Ramsar/.test(x)?'badge-ra'
             : /Biosphere|UNESCO/.test(x)?'badge-br'
             : 'badge-lc';
     return `<span class="badge ${c}">${x}</span>`;}).join(''),
   asOfFn:d=>`National reference: ${CURRENT.sanctuaries.n} WLS (${CURRENT.sanctuaries.date}) · ${CURRENT.tigerReserves.n} Tiger Reserves (${CURRENT.tigerReserves.date}). Deck shows a curated subset.`},

 sp:{data:SPECIES,color:'var(--sp)',strat:'ssp',label:'Species',frontMode:'name',
   stratTitle:'Retrieve before you flip — taxonomy, IUCN, distribution, ecology, PA association',
   stratBody:'The front gives you only the common name. Before flipping, generate five things. TAXONOMY: family and genus, because category errors are the commonest distractor. STATUS: CR, EN, VU or NT, and at what taxonomic level. DISTRIBUTION: genuinely India-only, or also Nepal, Sri Lanka, Central Asia. ECOLOGY: arboreal or terrestrial, nocturnal or diurnal, diet, locomotion. PROTECTED AREAS: which sites is it associated with. Filter by status to drill the CR and EN lists.',
   ff:'iucn',fl:'Filter by IUCN status',
   nameFn:d=>d.name,
   headerFn:d=>`${d.grp.toUpperCase()} · ${d.sci}`,
   factsFn:d=>[
     {k:'Scientific name',v:d.sci},
     {k:'Taxonomic position',v:d.taxon},
     {k:'IUCN status',v:d.iucn},
     {k:'Distribution',v:d.habitat},
     {k:'Ecology & behaviour',v:d.ecology},
     {k:'Protected areas',v:d.pa},
     {k:'Legal protection',v:d.legal}],
   hookFn:d=>d.hook,trapFn:d=>d.trap,
   badgesFn:d=>{const m={CR:'badge-cr',EN:'badge-en',VU:'badge-vu',NT:'badge-nt',LC:'badge-lc'};
     const key=(d.iucn||'').split(' ')[0];
     return m[key]?`<span class="badge ${m[key]}">IUCN ${key}</span>`:'';},
   asOfFn:d=>d.asOf?`Figures: ${d.asOf}`:''},

 c:{data:CONCEPTS,color:'var(--c)',strat:'sc',label:'Concepts & Law',frontMode:'question',
   stratTitle:'Precise question on the front — answer, statutory basis and trap on the back',
   stratBody:'These are not entity cards. The front carries an exact recall question. Before flipping, answer it in a sentence and name the statutory provision if one applies. Protected-area categories, wildlife law, Ramsar obligations, IUCN structure and conservation programmes are frequently the deciding statement in a multi-statement question. Focus on who the governing authority is, what is permitted, what is prohibited, and what the legal basis actually is.',
   ff:'topic',fl:'Filter by topic',
   nameFn:d=>d.cue,
   headerFn:d=>`${d.topic.toUpperCase()} · ${d.detail}`,
   factsFn:d=>[
     {k:'Concept',v:d.name},
     {k:'Topic',v:d.topic},
     {k:'Legal / factual basis',v:d.detail}],
   hookFn:d=>d.hook,trapFn:d=>d.trap,
   badgesFn:d=>`<span class="badge badge-lc">${d.topic}</span>`,
   asOfFn:d=>''},

 rv:{data:REVERSE,color:'var(--rv)',strat:'srv',label:'Reverse Retrieval',frontMode:'question',
   stratTitle:'The clue comes first — recall in the direction the exam actually asks',
   stratBody:'Knowing that Kanha holds barasingha does not mean you can answer "which protected area conserves a hard-ground, exclusively graminivorous swamp deer" under time pressure. These cards run the cue first and the entity second: species to protected area, basin to protected area set, ecology to species, behaviour to species, ordinal to Ramsar Site, and legal provision to consequence.',
   ff:'dir',fl:'Filter by retrieval direction',
   nameFn:d=>d.cue,
   headerFn:d=>`ANSWER · ${d.state}`,
   factsFn:d=>[
     {k:'Answer',v:d.answer},
     {k:'Location',v:d.state},
     {k:'Retrieval direction',v:d.dir}],
   hookFn:d=>d.hook,trapFn:d=>'',
   badgesFn:d=>`<span class="badge badge-lc">${d.dir}</span>`,
   asOfFn:d=>''},
};

function totalCards(){return Object.values(TABS).reduce((a,c)=>a+c.data.length,0);}

function init(){
  document.getElementById('hdSub').textContent=
    `UPSC ACTIVE-RECALL DECK · ${totalCards()} CARDS · DATA AS OF ${CURRENT.asOf.toUpperCase()}`;

  // Header stats: national reference totals are labelled as such,
  // and the deck total is labelled separately.
  document.getElementById('hdStats').innerHTML=[
    [CURRENT.ramsar.n,'Ramsar (India)'],
    [`${CURRENT.nationalParks.wiiAggregate}/${CURRENT.nationalParks.odishaOrdinal}`,'NP (disputed)'],
    [CURRENT.sanctuaries.n,'WLS (India)'],
    [CURRENT.tigerReserves.n,'Tiger Reserves'],
    [totalCards(),'Cards in deck'],
  ].map(([n,l])=>`<div class="hstat"><span class="hstat-n">${n}</span><span class="hstat-l">${l}</span></div>`).join('');

  // Tab labels show ACTUAL card counts from data.length — never national totals.
  Object.entries(TABS).forEach(([k,cfg])=>{
    const el=document.getElementById('lbl-'+k);
    if(el) el.textContent=`${cfg.label} (${cfg.data.length})`;
  });

  buildQF();
  switchTab('r');

  document.addEventListener('keydown',e=>{
    if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
    if(e.key===' '){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight'||e.key==='l')nav(1);
    else if(e.key==='ArrowLeft'||e.key==='h')nav(-1);
    else if(e.key==='k')mark('k');
    else if(e.key==='r')mark('r');
  });
}

window.switchTab=function(t){
  if(t==='facts'){showFacts();return;}
  TAB=t; reviewMode=false;
  document.getElementById('rvBtn').classList.remove('active');
  document.getElementById('rvBanner').classList.remove('show');
  document.getElementById('filterSel').disabled=false;
  document.getElementById('searchBox').disabled=false;
  document.getElementById('cardArea').style.display='block';
  document.getElementById('qfSection').classList.remove('visible');
  document.querySelectorAll('.tab').forEach(b=>b.className='tab');
  document.getElementById('tab-'+t).className='tab a'+t;
  const cfg=TABS[t];
  document.getElementById('stratBox').className='strategy '+cfg.strat;
  document.getElementById('stratTitle').textContent=cfg.stratTitle;
  document.getElementById('stratBody').textContent=cfg.stratBody;
  document.getElementById('pbar').style.background=cfg.color;
  buildFilter(t);
  document.getElementById('searchBox').value='';
  applyFilter();
};

function showFacts(){
  document.getElementById('cardArea').style.display='none';
  document.getElementById('qfSection').classList.add('visible');
  document.querySelectorAll('.tab').forEach(b=>b.className='tab');
  document.getElementById('tab-facts').className='tab af';
}

function buildFilter(t){
  const cfg=TABS[t], sel=document.getElementById('filterSel');
  sel.innerHTML='';
  const all=document.createElement('option');
  all.value='All'; all.textContent=`— ${cfg.fl} —`;
  sel.appendChild(all);
  [...new Set(cfg.data.map(d=>d[cfg.ff]).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}

window.applyFilter=function(){
  const cfg=TABS[TAB];
  const fv=document.getElementById('filterSel').value;
  const s=document.getElementById('searchBox').value.toLowerCase().trim();
  let base=cfg.data.slice();
  if(reviewMode){
    base=base.filter(d=>scores[d.id]==='r');
  } else {
    if(fv&&fv!=='All')base=base.filter(d=>d[cfg.ff]===fv);
    if(s)base=base.filter(d=>JSON.stringify(d).toLowerCase().includes(s));
  }
  filtered=base; idx=0; flipped=false;
  document.getElementById('cInner').classList.remove('flipped');
  render(); updateScore();
};

window.shuffleDeck=function(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx=0;flipped=false;
  document.getElementById('cInner').classList.remove('flipped');
  render();
};

window.toggleReviewMode=function(){
  reviewMode=!reviewMode;
  const btn=document.getElementById('rvBtn'), banner=document.getElementById('rvBanner');
  btn.classList.toggle('active',reviewMode);
  document.getElementById('filterSel').disabled=reviewMode;
  document.getElementById('searchBox').disabled=reviewMode;
  applyFilter();
  if(reviewMode){
    banner.textContent=filtered.length
      ? `Review mode — practising ${filtered.length} card${filtered.length===1?'':'s'} you marked in this section. Marking one as known removes it from the queue. Press the button again to exit.`
      : 'Review mode — nothing marked for review in this section yet. Work through the deck and press "Need review" on anything that did not come back instantly.';
    banner.classList.add('show');
  } else banner.classList.remove('show');
};

window.resetScores=function(){
  if(!confirm('Clear all known and review marks across every section?'))return;
  scores={};
  try{localStorage.removeItem('upsc_v4_scores');}catch(e){}
  applyFilter();
};

window.flipCard=function(){
  flipped=!flipped;
  document.getElementById('cInner').classList.toggle('flipped',flipped);
};

window.nav=function(dir){
  if(!filtered.length)return;
  idx=Math.max(0,Math.min(filtered.length-1,idx+dir));
  flipped=false;
  document.getElementById('cInner').classList.remove('flipped');
  render();
};

window.mark=function(type){
  if(!filtered.length)return;
  scores[filtered[idx].id]=type;
  try{localStorage.setItem('upsc_v4_scores',JSON.stringify(scores));}catch(e){}
  updateScore();
  if(reviewMode&&type==='k'){
    filtered.splice(idx,1);
    if(!filtered.length){
      document.getElementById('rvBanner').textContent='Review queue cleared for this section.';
      render();updateScore();return;
    }
    idx=Math.min(idx,filtered.length-1);
    flipped=false;
    document.getElementById('cInner').classList.remove('flipped');
    render();updateScore();return;
  }
  if(idx<filtered.length-1)nav(1);
};

function render(){
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  const nameEl=document.getElementById('cName');

  if(!filtered.length){
    nameEl.className='card-name';
    set('cName',reviewMode?'Nothing to review here':'No matching cards');
    set('cFlipHint',reviewMode?'Mark cards with "Need review" first':'Try a different filter or search term');
    set('counter','0 / 0'); set('bHook',''); set('bHeader',''); set('bAsOf','');
    document.getElementById('bFacts').innerHTML='';
    document.getElementById('bBadges').innerHTML='';
    document.getElementById('bTrapWrap').style.display='none';
    return;
  }

  const cfg=TABS[TAB], d=filtered[idx];

  // ---- FRONT ----------------------------------------------------
  // 'name'     → entity name ONLY. Nothing else is written to the front.
  // 'question' → the recall question / clue, in a smaller reading size.
  if(cfg.frontMode==='question'){
    nameEl.className='card-name card-question';
  } else {
    nameEl.className='card-name';
  }
  set('cName',cfg.nameFn(d));
  set('cFlipHint','tap to reveal ↑');

  // ---- BACK -----------------------------------------------------
  set('bHeader',cfg.headerFn(d));
  document.getElementById('bFacts').innerHTML=cfg.factsFn(d)
    .filter(f=>f.v)
    .map(f=>`<div class="fact"><div class="fact-k">${f.k}</div><div class="fact-v">${f.v}</div></div>`).join('');
  set('bHook',cfg.hookFn(d)||'');
  const trap=cfg.trapFn?cfg.trapFn(d):'';
  document.getElementById('bTrapWrap').style.display=trap?'block':'none';
  if(trap)set('bTrap',trap);
  document.getElementById('bBadges').innerHTML=cfg.badgesFn(d)||'';
  set('bAsOf',cfg.asOfFn?(cfg.asOfFn(d)||''):'');
  set('counter',`${idx+1} / ${filtered.length}`);
}

function updateScore(){
  const ids=new Set(TABS[TAB].data.map(d=>d.id));
  const rel=Object.entries(scores).filter(([k])=>ids.has(k));
  const known=rel.filter(([,v])=>v==='k').length;
  const review=rel.filter(([,v])=>v==='r').length;
  const total=ids.size;
  document.getElementById('knownCt').textContent=known;
  document.getElementById('reviewCt').textContent=review;
  document.getElementById('leftCt').textContent=Math.max(0,total-known-review);
  document.getElementById('pbar').style.width=total?(known/total*100)+'%':'0%';
}

function buildQF(){
  document.getElementById('qfSection').innerHTML=QF.map(block=>
    `<div class="qf-card"><div class="qf-title">${block.title}</div><div class="qf-date">${block.date}</div>
     <div class="qf-grid">${Object.entries(block.facts).map(([k,v])=>
       `<div class="qf-item"><span class="qf-k">${k}</span>${v}</div>`).join('')}</div></div>`
  ).join('');
}

init();

</script>
