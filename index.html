{id:'w35',name:'Coringa Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh',district:'Kakinada (Dr B. R. Ambedkar Konaseema)',species:'Saltwater crocodile, fishing cat, smooth-coated otter, olive ridley offshore',ecology:'Mangrove estuary at the Godavari delta',river:'GODAVARI delta',hook:"One of India's larger mangrove tracts after the Sundarbans and Bhitarkanika, at the Godavari delta. A significant saltwater crocodile and fishing cat habitat.",trap:'Coringa is on the GODAVARI delta in Andhra Pradesh — do not confuse with Bhitarkanika (Brahmani–Baitarani, Odisha).',designations:['Wildlife Sanctuary']},
{id:'w36',name:'Koundinya Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh',district:'Chittoor',species:'Asian elephant, leopard, sloth bear, chital',ecology:'Southern dry deciduous and thorn forest of the Eastern Ghats',river:'Palar — Kaundinya and Kaigal streams',hook:"The ONLY protected area in Andhra Pradesh with a resident ASIAN ELEPHANT population, recolonised from Karnataka and Tamil Nadu in the 1980s. Elephant corridor site.",trap:'',designations:['Wildlife Sanctuary','Elephant Reserve']},
{id:'w37',name:'Sri Lankamalleswara Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh',district:'Kadapa (YSR)',species:'Jerdon\'s courser, sloth bear, leopard, chinkara',ecology:'Scrub jungle and dry deciduous forest of the Eastern Ghats',river:'Penna basin',hook:"The site where JERDON'S COURSER (Rhinoptilus bitorquatus) was REDISCOVERED in 1986 after being considered extinct since 1900. A nocturnal, critically endangered bird endemic to this small Andhra scrub belt.",trap:"Jerdon's courser is a NOCTURNAL bird of scrub jungle in Andhra Pradesh — not a Western Ghats or Himalayan species.",designations:['Wildlife Sanctuary']},
{id:'w38',name:'Kolleru Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh',district:'Eluru / West Godavari / Krishna',species:'Spot-billed pelican, painted stork, grey pelican',ecology:'Large shallow freshwater lake BETWEEN the Krishna and Godavari deltas',river:'BETWEEN the Krishna and Godavari deltas',hook:'A natural flood-balancing lake lying BETWEEN TWO GREAT DELTAS — its position is the standard exam cue. Also a Ramsar Site. Major pelican and stork breeding site.',trap:'',designations:['Wildlife Sanctuary','Ramsar Site']},
{id:'w39',name:'Pulicat Lake Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Andhra Pradesh & Tamil Nadu',district:'Tirupati (AP) / Tiruvallur (TN)',species:'Greater flamingo, pelican, shorebirds',ecology:'Brackish coastal lagoon separated from the Bay of Bengal by Sriharikota island',river:'Swarnamukhi / Kalangi; Bay of Bengal',hook:"India's second-largest brackish coastal lagoon after Chilika, straddling two states. SRIHARIKOTA — the ISRO launch site — sits on the barrier island separating it from the sea.",trap:'Pulicat is a BRACKISH LAGOON like Chilika, not a freshwater lake. It spans Andhra Pradesh AND Tamil Nadu.',designations:['Wildlife Sanctuary']},
{id:'w40',name:"D'Ering Memorial Wildlife Sanctuary",paType:'Wildlife Sanctuary',state:'Arunachal Pradesh',district:'East Siang',species:'Bengal florican, wild buffalo, hog deer, Gangetic dolphin',ecology:'Riverine grassland islands on the Siang–Brahmaputra floodplain',river:'BRAHMAPUTRA — Siang / Dibang / Lohit confluence',hook:'Riverine grassland at the point where the Siang, Dibang and Lohit merge to form the Brahmaputra. A key BENGAL FLORICAN site in Arunachal Pradesh.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w41',name:'Pakke Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Arunachal Pradesh',district:'East Kameng / Pakke-Kessang',species:'Great hornbill, wreathed hornbill, tiger, clouded leopard',ecology:'Tropical evergreen and semi-evergreen forest of the Eastern Himalayan foothills',river:'Brahmaputra — Pakke / Kameng',hook:"Core of PAKKE TIGER RESERVE. Internationally known for the HORNBILL NEST ADOPTION PROGRAMME, in which Nyishi communities — formerly hornbill hunters — now protect nests. Won an India Biodiversity Award.",trap:'',designations:['Wildlife Sanctuary','Pakke Tiger Reserve','Elephant Reserve']},
{id:'w42',name:'Amchang Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Assam',district:'Kamrup Metropolitan',species:'Asian elephant, Chinese pangolin, capped langur, slow loris',ecology:'Semi-evergreen forest hills on the eastern edge of Guwahati',river:'Brahmaputra — south bank',hook:'A peri-urban sanctuary on Guwahati\'s eastern fringe, adjoining the Deepor Beel Ramsar landscape. A frequent flashpoint for urban encroachment and elephant conflict.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w43',name:'Kalesar Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Haryana',district:'Yamunanagar',species:'Leopard, sambar, chital, Indian python',ecology:'Sal forest of the Siwalik foothills',river:'Ganga — Yamuna',hook:'Adjoins Kalesar National Park and connects the Haryana Siwaliks with Rajaji NP in Uttarakhand and Simbalbara in Himachal Pradesh — a three-state Siwalik corridor.',trap:'Kalesar exists as BOTH a National Park and a separate Wildlife Sanctuary — two distinct legal units in the same landscape.',designations:['Wildlife Sanctuary','Adjoins Kalesar National Park']},
{id:'w44',name:'Sukhna Lake Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Chandigarh',district:'Chandigarh',species:'Sambar, barking deer, Indian pangolin, migratory waterfowl',ecology:'Siwalik foothill scrub around the Sukhna reservoir catchment',river:'Sukhna Choe (Ghaggar system)',hook:"Chandigarh's only wildlife sanctuary, protecting the catchment of the man-made Sukhna Lake in the Siwalik foothills.",trap:'',designations:['Wildlife Sanctuary']},
{id:'w45',name:'Kalatop-Khajjiar Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Himachal Pradesh',district:'Chamba',species:'Himalayan black bear, serow, goral, Himalayan monal',ecology:'Temperate deodar and oak forest of the Dhauladhar range',river:'Indus — Ravi',hook:'A temperate deodar forest sanctuary in the Ravi catchment of Chamba, in the Dhauladhar range.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w46',name:'Biligiri Rangaswamy Temple Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Karnataka',district:'Chamarajanagar',species:'Tiger, Asian elephant, gaur, dhole, four-horned antelope',ecology:'Forest bridge between the Eastern and Western Ghats',river:'CAUVERY — Suvarnavathi / Cauvery tributaries',hook:"Declared a TIGER RESERVE in 2011. Forms a CRITICAL ECOLOGICAL BRIDGE between the Eastern and Western Ghats. The Soliga tribal community here became among the first in India to secure FOREST RIGHTS ACT community rights INSIDE a tiger reserve.",trap:'BRT is in the CAUVERY BASIN — relevant to Cauvery-basin protected area questions.',designations:['Wildlife Sanctuary','BRT Tiger Reserve']},
{id:'w47',name:'Cauvery Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Karnataka',district:'Chamarajanagar / Ramanagara / Mandya',species:'Grizzled giant squirrel, hump-backed mahseer, elephant, smooth-coated otter',ecology:'Riverine and dry deciduous forest along the Cauvery gorge',river:'CAUVERY (main stem)',hook:"A long stretch of the CAUVERY itself. A key habitat of the GRIZZLED GIANT SQUIRREL outside Tamil Nadu and of the critically endangered HUMP-BACKED MAHSEER (Tor remadevii), a Cauvery endemic.",trap:'The hump-backed mahseer (Tor remadevii) is the CR Cauvery endemic; the blue-finned mahseer (Tor khudree) is a different, more widely distributed species.',designations:['Wildlife Sanctuary']},
{id:'w48',name:'Bhadra Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Karnataka',district:'Chikkamagaluru / Shivamogga',species:'Tiger, elephant, gaur, Malabar giant squirrel',ecology:'Moist and dry deciduous forest around the Bhadra reservoir',river:'Krishna — Bhadra (Tungabhadra system)',hook:"India's most cited VOLUNTARY VILLAGE RELOCATION success: around 16 villages were resettled with consent in the early 2000s, and the model is widely referenced in conservation policy.",trap:'',designations:['Wildlife Sanctuary','Bhadra Tiger Reserve']},
{id:'w49',name:'Dandeli Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Karnataka',district:'Uttara Kannada',species:'Black panther, hornbills (four species), Indian giant squirrel',ecology:'Moist deciduous and semi-evergreen Western Ghats forest',river:'Kali',hook:'Part of KALI TIGER RESERVE with Anshi National Park. Notable for FOUR hornbill species and for black panther (melanistic leopard) records.',trap:'',designations:['Wildlife Sanctuary','Kali Tiger Reserve']},
{id:'w50',name:'Sharavathi Valley Lion-tailed Macaque Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Karnataka',district:'Shivamogga / Uttara Kannada',species:'Lion-tailed macaque, Malabar giant squirrel, king cobra',ecology:'Tropical evergreen Western Ghats forest of the Sharavathi valley',river:'Sharavathi',hook:'Renamed to foreground the LION-TAILED MACAQUE. On the Sharavathi, the river of the Jog Falls, in the central Western Ghats.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w51',name:'Bhimashankar Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Maharashtra',district:'Pune / Thane / Raigad',species:'INDIAN GIANT SQUIRREL (Shekru, state animal of Maharashtra), leopard, sambar',ecology:'Semi-evergreen and moist deciduous Sahyadri forest',river:'Krishna — Bhima (source)',hook:"Declared for the INDIAN GIANT SQUIRREL or SHEKRU, the state animal of Maharashtra. Contains the SOURCE OF THE BHIMA river and the Bhimashankar Jyotirlinga temple.",trap:'',designations:['Wildlife Sanctuary']},
{id:'w52',name:'Koyna Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Maharashtra',district:'Satara',species:'Tiger, Indian bison, giant squirrel, leopard',ecology:'Semi-evergreen Sahyadri forest around the Koyna (Shivsagar) reservoir',river:'Krishna — Koyna',hook:'Part of SAHYADRI TIGER RESERVE with Chandoli NP. Surrounds the Shivsagar reservoir behind the Koyna dam. Part of the Western Ghats UNESCO WHS serial property.',trap:'',designations:['Wildlife Sanctuary','Sahyadri Tiger Reserve','Western Ghats UNESCO WHS']},
{id:'w53',name:'Karnala Bird Sanctuary',paType:'Wildlife Sanctuary',state:'Maharashtra',district:'Raigad',species:'Malabar grey hornbill, ashy minivet, migratory forest birds',ecology:'Moist deciduous forest around the Karnala fort pinnacle',river:'Patalganga (Arabian Sea drainage)',hook:'A small bird sanctuary near Panvel dominated by the Karnala fort pinnacle. A well-known site for wintering and passage forest birds close to Mumbai.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w54',name:'Melghat Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Maharashtra',district:'Amravati',species:'Tiger, sloth bear, dhole, forest owlet',ecology:'Dry deciduous teak forest of the Satpura–Gawilgarh hills',river:'TAPTI headwaters — Sipna, Khandu, Khapra',hook:"One of the ORIGINAL NINE TIGER RESERVES of 1973. 'Melghat' means meeting of the ghats. A confirmed site for the rediscovered FOREST OWLET.",trap:'The FOREST OWLET is a CENTRAL INDIAN dry deciduous forest bird — Melghat and adjacent MP forests — NOT a Western Ghats species.',designations:['Wildlife Sanctuary','Melghat Tiger Reserve']},
{id:'w55',name:'Kawal Wildlife Sanctuary',paType:'Wildlife Sanctuary (within a Tiger Reserve)',state:'Telangana',district:'Mancherial / Nirmal / Jayashankar',species:'Tiger, leopard, gaur, chital',ecology:'Dry deciduous teak and bamboo forest of the Deccan',river:'GODAVARI — Kadam / Peddavagu',hook:'Declared a TIGER RESERVE in 2012. Forms a corridor between Tadoba–Andhari (Maharashtra) and Indravati (Chhattisgarh). On the Godavari catchment.',trap:'',designations:['Wildlife Sanctuary','Kawal Tiger Reserve']},
{id:'w56',name:'Eturnagaram Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Telangana',district:'Mulugu',species:'Tiger, leopard, gaur, sloth bear, blackbuck',ecology:'Dry deciduous forest bisected by the Dayyam Vagu',river:'GODAVARI — Godavari and Dayyam Vagu',hook:'One of the oldest sanctuaries in the Telangana region, notified in 1953 by the Nizam government. On the Godavari in the Mulugu forests.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w57',name:'Kumbhalgarh Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Rajasthan',district:'Rajsamand / Udaipur / Pali',species:'Indian wolf, leopard, sloth bear, chinkara, four-horned antelope',ecology:'Dry deciduous and thorn forest of the Aravalli range',river:'Banas / Luni headwaters',hook:'An ARAVALLI sanctuary known for one of the more significant INDIAN WOLF populations in Rajasthan. Surrounds the Kumbhalgarh Fort, part of the Hill Forts of Rajasthan UNESCO WHS.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w58',name:'Point Calimere Wildlife and Bird Sanctuary',paType:'Wildlife Sanctuary',state:'Tamil Nadu',district:'Nagapattinam / Tiruvarur',species:'Greater flamingo, blackbuck, spot-billed pelican, spoon-billed sandpiper',ecology:'Saline lagoon, tidal mudflats and TROPICAL DRY EVERGREEN FOREST',river:'Palk Strait / Bay of Bengal; Great Vedaranyam Swamp',hook:'Combines the Great Vedaranyam Swamp, tidal mudflats and one of the last tracts of TROPICAL DRY EVERGREEN FOREST in peninsular India. Also a Ramsar Site. Holds a blackbuck population — an unusual coastal-plus-grassland pairing.',trap:'',designations:['Wildlife Sanctuary','Ramsar Site']},
{id:'w59',name:'Barsey Rhododendron Sanctuary',paType:'Wildlife Sanctuary',state:'Sikkim',district:'Gyalshing (West Sikkim)',species:'Rhododendron species (many), red panda, Himalayan black bear',ecology:'Temperate rhododendron and magnolia forest on the Singalila ridge',river:'Teesta — Rangit / Rammam',hook:'Protects a dense RHODODENDRON forest on the Singalila ridge along the Nepal border. Rhododendron is the state tree/flower association of Sikkim; peak bloom is in April–May.',trap:'',designations:['Wildlife Sanctuary']},
{id:'w60',name:'Pangolakha Wildlife Sanctuary',paType:'Wildlife Sanctuary',state:'Sikkim',district:'Pakyong (East Sikkim)',species:'Red panda, snow leopard, Himalayan black bear, satyr tragopan',ecology:'Temperate to alpine Eastern Himalayan forest on the Bhutan–Tibet frontier',river:'Teesta — Rangpo / Rongli',hook:'A trans-boundary conservation landscape adjoining Bhutan and the Chumbi valley, contiguous with Neora Valley NP (West Bengal). Red panda and snow leopard habitat.',trap:'',designations:['Wildlife Sanctuary']},
];

/* ===== SPECIES ===== */
const SPECIES=[
{id:'s1',name:'Bengal Tiger',sci:'Panthera tigris tigris',taxon:'Mammalia · Carnivora · Felidae · Panthera',iucn:'EN',grp:'Mammal',habitat:'Sal, teak, mangrove, terai grassland and Himalayan foothill forest across 18 states',ecology:'Solitary, territorial, largely nocturnal-crepuscular ambush predator',pa:'Corbett, Kanha, Bandhavgarh, Nagarhole, Sundarbans, Nagarjunsagar–Srisailam',hook:'India holds roughly three-quarters of the world\'s wild tigers — 3,682 in the 2022 All India Tiger Estimation. Project Tiger began in 1973 with nine reserves; there are now 58 Tiger Reserves.',trap:'Panthera tigris is ENDANGERED globally. Madhya Pradesh has the most tiger reserves (nine, after Madhav in 2025).',legal:'WPA Schedule I; CITES Appendix I',asOf:'AITE 2022; TR count Mar 2025'},
{id:'s2',name:'Asiatic Lion',sci:'Panthera leo (Asiatic subpopulation, formerly P. l. persica)',taxon:'Mammalia · Carnivora · Felidae · Panthera',iucn:'VU (species); Asiatic subpopulation assessed EN',grp:'Mammal',habitat:'Gir landscape, Saurashtra, Gujarat — the only wild range outside Africa',ecology:'Prides are smaller than African lions; males often range separately from females',pa:'Gir NP & WLS, Girnar, Mitiyala, Pania',hook:"NATURALLY FOUND IN INDIA ONLY among the world's wild lion populations outside Africa. About 891 lions in the 2025 estimation, up from 674 in 2020, with substantial numbers now living outside protected areas.",trap:'Scope the status carefully: PANTHERA LEO as a species is VULNERABLE on the IUCN Red List. The Asiatic subpopulation has been separately assessed as Endangered. Saying "the Asiatic lion is Endangered on the IUCN Red List" without that qualification is imprecise.',legal:'WPA Schedule I; CITES Appendix I',asOf:'2025 estimation'},
{id:'s3',name:'Snow Leopard',sci:'Panthera uncia',taxon:'Mammalia · Carnivora · Felidae · Panthera',iucn:'VU',grp:'Mammal',habitat:'Trans-Himalaya and Greater Himalaya above ~3,000 m — Ladakh, HP, Uttarakhand, Sikkim, Arunachal',ecology:'Cannot roar (incompletely ossified hyoid); very long tail for balance and warmth; preys on bharal and ibex',pa:'Hemis, Pin Valley, Kibber, Nanda Devi, Khangchendzonga, Namdapha',hook:'The Status of Snow Leopard in India assessment estimated about 718 individuals, with Ladakh holding the largest share. Ranges across 12 countries; India is one of them.',trap:'THE SNOW LEOPARD WAS DOWNLISTED FROM ENDANGERED TO VULNERABLE BY THE IUCN IN 2017, after a revised estimate of mature individuals. Any deck or answer still calling it Endangered is out of date.',legal:'WPA Schedule I; CITES Appendix I',asOf:'SPAI assessment; IUCN 2017'},
{id:'s4',name:'Indian Leopard',sci:'Panthera pardus fusca',taxon:'Mammalia · Carnivora · Felidae · Panthera',iucn:'VU (assessed at species level, Panthera pardus)',grp:'Mammal',habitat:'The most widely distributed large cat in India — forest, scrub, plantation and urban fringe',ecology:'Highly adaptable generalist; caches kills in trees; frequently nocturnal near human settlement',pa:'Sanjay Gandhi NP, Jawai, and most Indian forest PAs',hook:'The leopard occupies a far wider range of habitats than the tiger, including the immediate outskirts of large cities. Sanjay Gandhi National Park in Mumbai supports one of the highest recorded urban leopard densities.',trap:'The IUCN assesses PANTHERA PARDUS at species level as VULNERABLE. The Indian subspecies P. p. fusca has no separate global assessment — quoting a subspecies-specific status is not supportable.',legal:'WPA Schedule I; CITES Appendix I',asOf:'IUCN species assessment'},
{id:'s5',name:'Clouded Leopard',sci:'Neofelis nebulosa',taxon:'Mammalia · Carnivora · Felidae · NEOFELIS (not Panthera)',iucn:'VU',grp:'Mammal',habitat:'North-east India — Arunachal, Assam, Meghalaya, Nagaland, Mizoram, Tripura, north Bengal',ecology:'Highly arboreal; can climb down trunks head-first and hang from branches; longest canines relative to skull size of any living cat',pa:'Namdapha, Dampa, Manas, Neora Valley, Clouded Leopard NP (Tripura)',hook:'The state animal of Meghalaya. Its exceptional arboreal ability and rotating hind ankles set it apart from the big cats.',trap:'THE CLOUDED LEOPARD IS NEOFELIS NEBULOSA — NOT a member of genus Panthera. This is the standard trap in "four big cats of Namdapha" and "big cats of the Kamlang landscape" questions.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s6',name:'Asian Elephant',sci:'Elephas maximus indicus',taxon:'Mammalia · Proboscidea · Elephantidae',iucn:'EN',grp:'Mammal',habitat:'Four main populations: north-east, north-west (Shivalik), central-east and southern India',ecology:'Matriarchal herds; keystone seed disperser and habitat engineer; only males carry tusks in Asian elephants',pa:'Nagarhole, Bandipur, Wayanad, Mudumalai, Kaziranga, Rajaji, Periyar',hook:'India holds the largest share of the global Asian elephant population. Project Elephant began in 1992, and the elephant was declared a National Heritage Animal in 2010. Elephant corridors, not reserve area alone, are the binding constraint.',trap:'In Asian elephants only some MALES bear tusks; in African elephants both sexes typically do. A tuskless male Asian elephant is called a makhna.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s7',name:'Greater One-horned Rhinoceros',sci:'Rhinoceros unicornis',taxon:'Mammalia · Perissodactyla · Rhinocerotidae',iucn:'VU',grp:'Mammal',habitat:'Brahmaputra and terai floodplain alluvial grassland — Assam, West Bengal, Uttar Pradesh',ecology:'Grazer of tall alluvial grassland; single horn of keratin; strong swimmer; largely solitary',pa:'Kaziranga, Pobitora, Orang, Manas, Jaldapara, Gorumara, Dudhwa',hook:'Kaziranga alone held 2,613 rhinos in the 2022 census, the largest single population anywhere. Indian Rhino Vision 2020 sought to spread the population across more sites to reduce single-site risk.',trap:'NOT naturally found in India only — the greater one-horned rhinoceros also occurs in NEPAL (notably Chitwan). A statement claiming it is found only in India is FALSE.',legal:'WPA Schedule I; CITES Appendix I',asOf:'Kaziranga census 2022'},
{id:'s8',name:'Hard-ground Barasingha',sci:'Rucervus duvaucelii branderi',taxon:'Mammalia · Artiodactyla · Cervidae',iucn:'VU (species Rucervus duvaucelii)',grp:'Mammal',habitat:'KANHA National Park, Madhya Pradesh — the only wild population of this subspecies',ecology:'Almost exclusively GRAMINIVOROUS (grass-eating); adapted to FIRM, HARD GROUND rather than swamp; hooves less splayed than wet-ground swamp deer',pa:'Kanha (sole wild population); reintroduced to Satpura, Bandhavgarh, Van Vihar',hook:"THE defining protected-area/species pairing for UPSC: the hard-ground barasingha survives in the wild only in KANHA. Recovered from about 66 animals in the 1970s. State animal of Madhya Pradesh; Kanha's mascot is 'Bhoorsingh the Barasingha'.",trap:'Three swamp deer subspecies: BRANDERI = hard ground (Kanha); DUVAUCELII = wet ground (Dudhwa, Kishanpur); RANJITSINHI = eastern (Kaziranga). And barasingha is NOT the sangai — the sangai is Eld\'s deer of Manipur.',legal:'WPA Schedule I',asOf:''},
{id:'s9',name:'Sangai',sci:"Rucervus eldii eldii (Manipur brow-antlered deer / Eld's deer)",taxon:'Mammalia · Artiodactyla · Cervidae',iucn:'EN',grp:'Mammal',habitat:'Keibul Lamjao National Park, on the floating phumdis of Loktak Lake, Manipur',ecology:'Walks on a springy floating vegetation mat, producing the distinctive gait behind the name "dancing deer"; browses phumdi grasses',pa:'Keibul Lamjao NP only',hook:'The state animal of Manipur and the only deer in the world living on a floating wetland habitat. Its survival is tied directly to phumdi thickness, which the Ithai barrage has altered by holding water levels artificially steady.',trap:"SANGAI = Eld's deer (Rucervus eldii eldii), Manipur, floating phumdi. BARASINGHA = swamp deer (Rucervus duvaucelii), Kanha/Dudhwa. Different species entirely.",legal:'WPA Schedule I',asOf:''},
{id:'s10',name:'Himalayan Musk Deer',sci:'Moschus leucogaster (and related Moschus spp.)',taxon:'Mammalia · Artiodactyla · MOSCHIDAE (not Cervidae)',iucn:'EN',grp:'Mammal',habitat:'High-altitude Himalayan forest and scrub roughly 2,500–4,500 m — Uttarakhand, HP, Sikkim, Arunachal',ecology:'NO ANTLERS; males have elongated tusk-like canines; solitary; males possess a musk pod, the target of poaching',pa:'GANGOTRI NP, ASKOT WLS, Kedarnath WLS, Great Himalayan NP, Nanda Devi',hook:'Musk deer belong to their own family MOSCHIDAE, separate from true deer. The male musk pod is among the most valuable animal products by weight, driving persistent poaching.',trap:'Musk deer are HIGH-ALTITUDE HIMALAYAN animals. In a "most likely places to find musk deer" question, ASKOT and GANGOTRI qualify; KISHANPUR (terai UP) and MANAS (Brahmaputra foothills) do NOT.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s11',name:'Western Hoolock Gibbon',sci:'Hoolock hoolock',taxon:'Mammalia · Primates · Hylobatidae — a LESSER APE',iucn:'EN',grp:'Mammal',habitat:'North-east India south of the Brahmaputra and east of the Dibang — Assam, Meghalaya, Nagaland, Manipur, Mizoram, Tripura, Arunachal',ecology:'BRACHIATION — swings hand over hand beneath branches; almost entirely arboreal; frugivorous; monogamous pairs that sing duets; light-bodied with very long arms',pa:'Hollongapar Gibbon WLS (Jorhat), Dihing Patkai, Namdapha, Mehao',hook:"INDIA'S ONLY APE. Listed as ENDANGERED on the IUCN Red List. Hollongapar Gibbon Wildlife Sanctuary in Jorhat, Assam is the sanctuary most closely identified with it.",trap:"Gibbons are LESSER APES — slender, light and extremely agile. They do NOT have a strong, heavy, gorilla-like build. Sexes differ in colour: males black, females buff-brown. Also note apes have NO TAIL, unlike monkeys.",legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s12',name:'Lion-tailed Macaque',sci:'Macaca silenus',taxon:'Mammalia · Primates · Cercopithecidae',iucn:'EN',grp:'Mammal',habitat:'ENDEMIC to the Western Ghats rainforests of Kerala, Karnataka and Tamil Nadu',ecology:'DIURNAL and highly arboreal; rarely descends to the ground; frugivorous with a silver-white mane and a lion-like tail tuft',pa:'Silent Valley, Kalakad Mundanthurai, Anamalai, Parambikulam, Shendurney',hook:'Endemic to the Western Ghats and one of the most habitat-restricted primates in the world, largely confined to unbroken rainforest canopy. Fragmentation by plantations is the main threat.',trap:'The lion-tailed macaque is DIURNAL — active by day. In "which of these are nocturnal" questions it is the wrong answer, whereas the MALABAR CIVET is nocturnal and the SAMBAR is largely nocturnal-crepuscular.',legal:'WPA Schedule I',asOf:''},
{id:'s13',name:'Malabar Civet',sci:'Viverra civettina',taxon:'Mammalia · Carnivora · Viverridae',iucn:'CR',grp:'Mammal',habitat:'Western Ghats lowlands of Kerala and Karnataka — possibly extinct; no confirmed recent records',ecology:'NOCTURNAL, ground-dwelling and secretive; omnivorous',pa:'No confirmed extant protected population',hook:'One of the most poorly known mammals in India; there has been no confirmed sighting for decades and it may already be extinct. Its lowland Western Ghats habitat has been almost entirely converted to plantations.',trap:'The Malabar civet is NOCTURNAL — a standard correct option in nocturnality questions, paired against the diurnal lion-tailed macaque.',legal:'WPA Schedule I',asOf:''},
{id:'s14',name:'Fishing Cat',sci:'Prionailurus viverrinus',taxon:'Mammalia · Carnivora · Felidae',iucn:'VU',grp:'Mammal',habitat:'Wetlands, mangroves and marshes — Sundarbans, Chilika, Coringa, terai and Godavari–Krishna deltas',ecology:'Swims readily; scoops fish from water; partially webbed forefeet; largely nocturnal',pa:'Sundarbans, Chilika (Nalbana), Coringa, Bhitarkanika',hook:'The state animal of West Bengal, and the Indian small cat most dependent on wetlands. Aquaculture conversion and wetland reclamation are the primary threats.',trap:'THE FISHING CAT IS VULNERABLE ON THE IUCN RED LIST, not Endangered — it was downlisted in the 2016 reassessment.',legal:'WPA Schedule I',asOf:'IUCN 2016 assessment'},
{id:'s15',name:'Rusty-spotted Cat',sci:'Prionailurus rubiginosus',taxon:'Mammalia · Carnivora · Felidae',iucn:'NT',grp:'Mammal',habitat:'Deciduous forest and scrub across peninsular and central India, including the EASTERN GHATS; also Sri Lanka and Nepal',ecology:"One of the world's smallest wild cats, around 1–1.6 kg; nocturnal; agile climber",pa:'Gir, Tadoba, Nagarjunsagar–Srisailam, Eastern Ghats forests',hook:'Among the smallest cats on earth. Its Indian range is far wider than once believed, covering much of the peninsula including the Eastern Ghats — so a pairing of "rusty-spotted cat — Eastern Ghats" is CORRECT.',trap:'It is NOT restricted to the Western Ghats. And it is not endemic to India — it occurs in Sri Lanka and Nepal too.',legal:'WPA Schedule I',asOf:''},
{id:'s16',name:'Dhole',sci:'Cuon alpinus',taxon:'Mammalia · Carnivora · Canidae',iucn:'EN',grp:'Mammal',habitat:'Western Ghats, central Indian highlands and north-east India',ecology:'Pack-hunting, diurnal social canid; whistles to communicate; fewer molars than other canids',pa:'Nagarhole, Bandipur, Mudumalai, Wayanad, Kanha, Pench, Satpura',hook:'India holds the largest surviving dhole population globally. Unusually among large carnivores, dholes hunt cooperatively by day, and the Western Ghats landscape is their global stronghold.',trap:'The dhole is ENDANGERED — a higher category than the Indian wolf or the striped hyena, which is counterintuitive to many candidates.',legal:'WPA Schedule II',asOf:''},
{id:'s17',name:'Indian Pangolin',sci:'Manis crassicaudata',taxon:'Mammalia · Pholidota · Manidae',iucn:'EN',grp:'Mammal',habitat:'Peninsular India, plus Sri Lanka, Pakistan, Nepal and Bangladesh',ecology:'NOCTURNAL, burrowing myrmecophage (ants and termites); no teeth; body covered in overlapping keratin scales; rolls into a ball when threatened',pa:'Widely but thinly distributed across peninsular PAs',hook:'Pangolins are the most trafficked wild mammals in the world, taken for their scales and meat. All eight species are on CITES Appendix I with a commercial trade ban.',trap:'THE INDIAN PANGOLIN IS ENDANGERED (EN), NOT Critically Endangered. The CHINESE PANGOLIN (Manis pentadactyla) is CR. Confusing the two is a common error.',legal:'WPA Schedule I; CITES Appendix I',asOf:'IUCN assessment'},
{id:'s18',name:'Chinese Pangolin',sci:'Manis pentadactyla',taxon:'Mammalia · Pholidota · Manidae',iucn:'CR',grp:'Mammal',habitat:'North-east India — Assam, Arunachal, Meghalaya, Nagaland, Manipur, Mizoram; also Nepal, China, SE Asia',ecology:'Nocturnal, more arboreal than the Indian pangolin; myrmecophagous',pa:'North-east Indian forests',hook:'Critically Endangered, and the more threatened of the two pangolin species found in India. Its range in India is confined to the north-east.',trap:'Range split: INDIAN pangolin = peninsular India, EN. CHINESE pangolin = north-east India, CR.',legal:'WPA Schedule I; CITES Appendix I',asOf:'IUCN assessment'},
{id:'s19',name:'Ganges River Dolphin',sci:'Platanista gangetica',taxon:'Mammalia · Cetacea · Platanistidae',iucn:'EN',grp:'Mammal',habitat:'Ganga, Brahmaputra, Meghna and Karnaphuli–Sangu systems in India, Nepal and Bangladesh',ecology:'FUNCTIONALLY BLIND — the eye lacks a lens; navigates and hunts entirely by ECHOLOCATION; swims on its side; called susu from its breathing sound',pa:'Vikramshila Gangetic Dolphin Sanctuary, National Chambal Sanctuary, Katarniaghat, Upper Ganga Ramsar stretch',hook:"INDIA'S NATIONAL AQUATIC ANIMAL, declared in 2009. The first comprehensive national survey estimated 6,327 river dolphins in India — 6,324 Ganges river dolphins and only 3 Indus river dolphins. Uttar Pradesh recorded the highest number at 2,397, followed by Bihar at 2,220.",trap:'The Indus river dolphin is now treated as a SEPARATE SPECIES (Platanista minor), not a subspecies. In India it survives only in the Beas in Punjab, with just three recorded.',legal:'WPA Schedule I; CITES Appendix I',asOf:'Population Status of River Dolphins in India 2024'},
{id:'s20',name:'Irrawaddy Dolphin',sci:'Orcaella brevirostris',taxon:'Mammalia · Cetacea · Delphinidae',iucn:'EN',grp:'Mammal',habitat:'CHILIKA LAKE (Odisha) and the Sundarbans coastal waters — brackish and coastal, not a true river dolphin of the interior',ecology:'Rounded head with no beak; brackish-water specialist; occurs in coastal and estuarine waters and a few large rivers',pa:'Chilika (Nalbana), Sundarbans',hook:'Chilika Lake holds the only LAGOON population of the Irrawaddy dolphin in India and one of the largest anywhere. It also occurs in Sundarbans waters.',trap:'PAIRING TRAP: Irrawaddy dolphin belongs with CHILIKA, not the Chambal. The Chambal holds the GANGES river dolphin. An "Irrawaddy dolphin — Chambal River" pairing is FALSE.',legal:'WPA Schedule I',asOf:''},
{id:'s21',name:'Dugong',sci:'Dugong dugon',taxon:'Mammalia · Sirenia · Dugongidae',iucn:'VU',grp:'Mammal',habitat:'Gulf of Mannar, PALK BAY, Gulf of Kachchh and the Andaman & Nicobar Islands',ecology:'The only strictly HERBIVOROUS marine mammal; grazes SEAGRASS; slow-breeding with long calving intervals',pa:'Gulf of Mannar Marine BR, Dugong Conservation Reserve (Palk Bay), Gulf of Kachchh Marine NP',hook:"The state animal of the Andaman & Nicobar Islands. India's first DUGONG CONSERVATION RESERVE was established in Palk Bay, Tamil Nadu. Survival depends directly on seagrass meadow health.",trap:"Dugongs are NOT confined to the Gulf of Mannar. They occur in Palk Bay, the Gulf of Kachchh and the Andaman & Nicobar Islands as well. Also, the dugong is a SIRENIAN, related to manatees — not a cetacean.",legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s22',name:'Indian Wild Ass',sci:'Equus hemionus khur',taxon:'Mammalia · Perissodactyla · Equidae',iucn:'NT (species Equus hemionus)',grp:'Mammal',habitat:'Little Rann of Kachchh, Gujarat — the only Indian range',ecology:'Grazer of saline flats and grassy bets; extremely fast runner; herd-forming',pa:'Wild Ass Sanctuary, Little Rann of Kachchh',hook:'The khur is a subspecies of the ONAGER and has recovered strongly from a mid-20th-century collapse caused by disease and habitat loss.',trap:'Onager subspecies KHUR (Little Rann, Gujarat) is different from the KIANG (Equus kiang) of Ladakh. Note that Equus hemionus is only NEAR THREATENED — in "which are endangered or critically endangered" questions the Indian wild ass does NOT qualify.',legal:'WPA Schedule I',asOf:''},
{id:'s23',name:'Bactrian (Double-humped) Camel',sci:'Camelus bactrianus',taxon:'Mammalia · Artiodactyla · Camelidae',iucn:'Domesticated form (wild Camelus ferus is CR)',grp:'Mammal',habitat:'Nubra valley, Ladakh, in India; also Mongolia, China, Central Asia',ecology:'Two humps; adapted to extreme cold desert; historically a Silk Route pack animal',pa:'Nubra valley (Ladakh) — free-ranging domesticated herds',hook:'India\'s double-humped camels are a small feral-domesticated population in the Nubra valley of Ladakh, a legacy of Silk Route caravan trade.',trap:'NOT naturally found in India only. The Bactrian camel occurs across Mongolia, China and Central Asia, and the truly wild form (Camelus ferus) survives only in Mongolia and China — not India.',legal:'',asOf:''},
{id:'s24',name:'Indian Flying Fox',sci:'Pteropus giganteus (P. medius)',taxon:'Mammalia · Chiroptera · Pteropodidae — a megabat',iucn:'LC',grp:'Mammal',habitat:'Roosts in large colonies on tall trees across most of India',ecology:'FRUGIVOROUS AND NECTARIVOROUS — eats fruit, nectar and pollen. It does NOT feed on blood. An important seed disperser and pollinator; relies on eyesight and smell rather than echolocation',pa:'Widespread; roosts often in villages and temple groves',hook:'One of the largest bats in the world and an important pollinator and seed disperser of forest and orchard trees.',trap:"Two traps in one. First, the Indian flying fox was historically listed under the VERMIN category (Schedule V) of the Wild Life (Protection) Act. Second, it is a FRUIT BAT — it does NOT feed on blood. Only three vampire bat species drink blood and all are confined to the Americas. So a 'because it feeds on blood' explanation is false.",legal:'Historically WPA Schedule V (vermin)',asOf:''},
{id:'s25',name:'Great Indian Bustard',sci:'Ardeotis nigriceps',taxon:'Aves · Otidiformes · Otididae',iucn:'CR',grp:'Bird',habitat:'Arid and semi-arid grassland — Rajasthan (Jaisalmer/Barmer) is the stronghold; small numbers in Gujarat, Maharashtra, Karnataka, Andhra Pradesh',ecology:'Ground-nesting; lays a SINGLE egg; poor frontal vision with eyes set laterally, so it does not see power lines ahead in flight; one of the heaviest flying birds',pa:'Desert NP and Desert WLS (Rajasthan), Rollapadu (AP), Naliya/Abdasa (Gujarat)',hook:'The state bird of Rajasthan and one of the most threatened birds in the world, with the population reduced to roughly 100–150 birds. Collision with overhead transmission lines is the leading cause of adult mortality.',trap:'The Supreme Court in 2021 ordered undergrounding of power lines across bustard habitat; in 2024 the Court substantially revisited that order, balancing bustard protection against renewable energy obligations. Captive breeding runs at Sam and Ramdevra in Jaisalmer.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s26',name:'Bengal Florican',sci:'Houbaropsis bengalensis',taxon:'Aves · Otidiformes · Otididae',iucn:'CR',grp:'Bird',habitat:'Tall wet terai and Brahmaputra floodplain grassland — Manas, Kaziranga, Dudhwa, D\'Ering',ecology:'Males perform a leaping display flight over grassland in the breeding season; grassland-obligate',pa:'Manas, Kaziranga, Orang, Dudhwa, D\'Ering Memorial WLS',hook:'A grassland-obligate bustard whose decline tracks the loss of tall wet grassland to agriculture and plantation. Shares its habitat with the pygmy hog and the hispid hare.',trap:'Distinguish the BENGAL FLORICAN (CR, wet terai/Brahmaputra grassland) from the LESSER FLORICAN (CR, dry western grassland of Rajasthan, Gujarat, Madhya Pradesh).',legal:'WPA Schedule I',asOf:''},
{id:'s27',name:'Sarus Crane',sci:'Antigone antigone',taxon:'Aves · Gruiformes · Gruidae',iucn:'VU',grp:'Bird',habitat:'Agricultural wetlands and marshes of the Gangetic plain — Uttar Pradesh holds the largest population; also Gujarat, Rajasthan, Madhya Pradesh',ecology:'THE TALLEST FLYING BIRD IN THE WORLD, up to about 1.8 m; NON-MIGRATORY resident; pairs for life; nests in flooded paddy',pa:'Keoladeo, Saman, Sarsai Nawar, Sandi, Bhindawas, Yashwant Sagar',hook:'The state bird of Uttar Pradesh and a rare instance of a large threatened bird that thrives in FARMED landscapes rather than strict reserves, nesting in flooded paddy fields.',trap:'The sarus crane is RESIDENT and non-migratory. The DEMOISELLE, COMMON and BLACK-NECKED cranes are the migratory ones. Confusing sarus with a winter migrant is a frequent error.',legal:'WPA Schedule I',asOf:''},
{id:'s28',name:'Black-necked Crane',sci:'Grus nigricollis',taxon:'Aves · Gruiformes · Gruidae',iucn:'NT',grp:'Bird',habitat:'Breeds in Ladakh (Changthang); winters in Arunachal Pradesh (Sangti, Zemithang) and Bhutan',ecology:'The only crane that breeds and lives on high-altitude plateaus; nests in marshy ground above 4,000 m',pa:'Changthang Cold Desert WLS, Tso Kar and Tsomoriri Ramsar Sites',hook:'The state bird of Ladakh and the only alpine crane in the world. The Changthang plateau, including Tso Kar, is its sole Indian breeding ground; it is culturally revered in Buddhist tradition.',trap:'',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s29',name:'Demoiselle Crane',sci:'Grus virgo',taxon:'Aves · Gruiformes · Gruidae',iucn:'LC',grp:'Bird',habitat:'Winter migrant to western India — Khichan and Phalodi (Rajasthan), Gujarat',ecology:'THE SMALLEST CRANE; crosses the Himalaya on migration at great altitude; locally called kurja',pa:'Khichan Ramsar Site, Tal Chhapar, Little Rann',hook:'At Khichan in Jodhpur district, villagers have fed wintering demoiselle cranes for decades, producing one of the largest known winter congregations of the species. The site became a Ramsar Site in 2025.',trap:'Demoiselle crane is LEAST CONCERN globally despite the spectacle. Do not assume that a famous congregation implies a threatened status.',legal:'WPA Schedule IV',asOf:''},
{id:'s30',name:'White-rumped Vulture',sci:'Gyps bengalensis',taxon:'Aves · Accipitriformes · Accipitridae',iucn:'CR',grp:'Bird',habitat:'Across the Indian plains; nests colonially in tall trees',ecology:'Obligate scavenger; soars on thermals; rapid carcass consumption prevents disease spread',pa:'Vulture Safe Zones; breeding centres at Pinjore, Rani (Assam), Bhopal, Rajabhatkhawa',hook:'Once among the most abundant large raptors in the world, this species crashed by over 99% in the 1990s. Veterinary DICLOFENAC given to cattle caused fatal visceral gout and kidney failure in vultures feeding on treated carcasses; it was banned for veterinary use in 2006 and MELOXICAM adopted as the safe substitute.',trap:'Diclofenac was banned in 2006, but ketoprofen and aceclofenac were later also shown to be vulture-toxic. Three Gyps species (white-rumped, Indian, slender-billed) plus the red-headed vulture are Critically Endangered.',legal:'WPA Schedule I',asOf:''},
{id:'s31',name:'Forest Owlet',sci:'Athene blewitti (Heteroglaux blewitti)',taxon:'Aves · Strigiformes · Strigidae',iucn:'EN',grp:'Bird',habitat:'DRY DECIDUOUS FOREST OF CENTRAL INDIA — Madhya Pradesh, Maharashtra (Melghat, Tansa), and parts of Gujarat',ecology:'Unusually DIURNAL for an owl; hunts lizards and rodents from exposed perches',pa:'Melghat TR, Tansa WLS, Khandwa and Burhanpur forests',hook:'Lost to science for 113 years after 1884 and rediscovered in 1997 near Shahada on the Madhya Pradesh–Maharashtra border. Its range is now known to be wider than first thought.',trap:'THE FOREST OWLET IS A CENTRAL INDIAN SPECIES, NOT A WESTERN GHATS ONE. It is also now assessed as ENDANGERED rather than Critically Endangered, following range extensions.',legal:'WPA Schedule I',asOf:'IUCN reassessment'},
{id:'s32',name:'Great Hornbill',sci:'Buceros bicornis',taxon:'Aves · Bucerotiformes · Bucerotidae',iucn:'VU',grp:'Bird',habitat:'Western Ghats and north-east India — mature evergreen forest',ecology:'The female SEALS HERSELF INTO A TREE CAVITY with mud and droppings during nesting, leaving a slit through which the male feeds her; a keystone disperser of large-seeded rainforest trees',pa:'Anamalai, Silent Valley, Pakke, Namdapha, Nameri',hook:'State bird of both KERALA and ARUNACHAL PRADESH. Dependent on large old hollow-bearing trees, so it disappears from logged forest even when canopy remains. Pakke runs a well-known hornbill nest adoption programme.',trap:'The hollow casque is not solid bone — it is a keratin-covered, largely hollow structure that acts as a resonance chamber.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s33',name:'Western Tragopan',sci:'Tragopan melanocephalus',taxon:'Aves · Galliformes · Phasianidae',iucn:'VU',grp:'Bird',habitat:'Temperate western Himalayan forest of Himachal Pradesh, Uttarakhand and Jammu & Kashmir',ecology:'Ground-dwelling pheasant of dense undergrowth; males display an inflatable blue throat lappet',pa:'Great Himalayan NP, Daranghati, Kugti',hook:"THE STATE BIRD OF HIMACHAL PRADESH, locally called jujurana or king of birds. The Great Himalayan National Park is its main stronghold, with a conservation breeding centre at Sarahan.",trap:'',legal:'WPA Schedule I',asOf:''},
{id:'s34',name:'Gharial',sci:'Gavialis gangeticus',taxon:'Reptilia · Crocodylia · Gavialidae',iucn:'CR',grp:'Reptile',habitat:'Deep, fast, clear rivers with sandbanks — CHAMBAL above all, plus the Girwa, Son, Ken and Gandak',ecology:'EXTREMELY NARROW SNOUT specialised for catching fish; poorly adapted for walking on land; males develop a bulbous nasal GHARA used in display',pa:'National Chambal Sanctuary, Katarniaghat, Satkosia, Son Gharial Sanctuary',hook:'The National Chambal Sanctuary holds the great majority of the world population. Egg collection and captive rearing under the Crocodile Conservation Project from 1975 pulled the species back from near-extinction.',trap:'Three crocodilians occur in India: GHARIAL (CR, narrow snout, fish specialist), MUGGER (VU, broad snout, generalist) and SALTWATER CROCODILE (LC, estuarine, Bhitarkanika and Sundarbans).',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s35',name:'Olive Ridley Turtle',sci:'Lepidochelys olivacea',taxon:'Reptilia · Testudines · Cheloniidae',iucn:'VU',grp:'Reptile',habitat:'Odisha coast — GAHIRMATHA, Rushikulya and Devi river mouths; also Andhra, Tamil Nadu, Andaman & Nicobar',ecology:'ARRIBADA — synchronised mass nesting by tens of thousands of females on the same beach; temperature-dependent sex determination',pa:'Gahirmatha Marine WLS, Rushikulya rookery',hook:'The Odisha coast hosts some of the largest arribadas in the world. Trawler bycatch is the main cause of adult mortality, which is why Turtle Excluder Devices are mandated in the nesting season.',trap:'Olive ridley is VULNERABLE. Among sea turtles in Indian waters, the HAWKSBILL is Critically Endangered and the GREEN turtle Endangered.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
{id:'s36',name:'Gooty Tarantula (Peacock Tarantula)',sci:'Poecilotheria metallica',taxon:'ARACHNIDA · Araneae · Theraphosidae — an ARACHNID, not a crustacean or an insect',iucn:'CR',grp:'Invertebrate',habitat:'A single small forest patch in the ANDHRA PRADESH–TELANGANA region (Eastern Ghats), near Gooty in Anantapur',ecology:'ARBOREAL — lives in tree hollows in the forest canopy, not in ground burrows; CARNIVOROUS, taking insects and small vertebrates; iridescent metallic blue',pa:'Reserve forest patches of the Eastern Ghats',hook:'One of the most range-restricted spiders in the world, confined to a very small patch of dry deciduous forest. Its striking blue colour makes it a target of the international exotic pet trade.',trap:"THREE TRAPS. It is an ARACHNID (eight legs, two body parts), NOT a crustacean. It is CARNIVOROUS, NOT omnivorous. And it is ARBOREAL, living in tree holes. Its natural habitat in India is indeed limited to a small forest area.",legal:'CITES Appendix II',asOf:''},
{id:'s37',name:'Indian Squirrels (Funambulus spp.)',sci:'Funambulus palmarum / F. pennantii',taxon:'Mammalia · Rodentia · Sciuridae',iucn:'LC',grp:'Mammal',habitat:'Across India — gardens, plantations, scrub and urban trees',ecology:'ARBOREAL — nest in TREE HOLES and build leafy drays in branches, NOT ground burrows; SCATTER-HOARD food in shallow ground caches; OMNIVOROUS, taking nuts, seeds, fruit, insects, eggs and small birds',pa:'Ubiquitous',hook:'Palm squirrels are among the most familiar Indian mammals, and their scatter-hoarding of seeds in the soil makes them significant seed dispersers.',trap:'Precise ecology matters here. Indian squirrels do NOT build nests by burrowing in the ground — they nest in trees. They DO store food in the ground by scatter-hoarding, and they ARE omnivorous. So of "burrow nests / ground food storage / omnivorous", only the last two hold.',legal:'WPA Schedule IV (F. palmarum historically Schedule IV)',asOf:''},
{id:'s38',name:'Blue-finned Mahseer',sci:'Tor khudree',taxon:'Actinopterygii · Cypriniformes · Cyprinidae',iucn:'EN',grp:'Fish',habitat:'CAUVERY RIVER system and Deccan rivers of Karnataka, Tamil Nadu and Maharashtra',ecology:'A large migratory riverine cyprinid needing clean, fast, well-oxygenated water; an indicator of river health',pa:'Cauvery WLS, Bhadra, Ranganathittu stretch',hook:'The blue-finned mahseer is closely identified with the CAUVERY, where community-supported conservation angling at Bhavani and along the river has been credited with protecting stocks. It is a strong pairing with the Cauvery for exam purposes.',trap:'"Blue-finned mahseer — Cauvery River" is a CORRECT pairing. The hump-backed mahseer (Tor remadevii) is the Critically Endangered Cauvery endemic — do not merge the two.',legal:'',asOf:''},
{id:'s39',name:'Pygmy Hog',sci:'Porcula salvania',taxon:'Mammalia · Artiodactyla · Suidae',iucn:'EN',grp:'Mammal',habitat:'Tall wet alluvial grassland of the Assam terai — Manas is the key wild site',ecology:"THE SMALLEST WILD PIG IN THE WORLD, about 6–10 kg; the only pig that BUILDS A NEST with a roof; an indicator of intact tall grassland",pa:'Manas NP, with reintroductions to Orang, Barnadi and Bornadi',hook:'An indicator species for tall wet grassland — the same habitat as the Bengal florican and hispid hare. Captive breeding at the Pygmy Hog Conservation Programme has enabled reintroductions.',trap:'Placed in its own genus PORCULA, separate from Sus. Assessed as ENDANGERED following successful captive breeding and reintroduction.',legal:'WPA Schedule I',asOf:'IUCN assessment'},
{id:'s40',name:'Hangul (Kashmir Stag)',sci:'Cervus hanglu hanglu',taxon:'Mammalia · Artiodactyla · Cervidae',iucn:'EN (Cervus hanglu)',grp:'Mammal',habitat:'DACHIGAM NATIONAL PARK, Jammu & Kashmir — the last significant population',ecology:'The only Asiatic representative of the red deer group surviving in India; migrates altitudinally between winter valley forest and summer alpine pasture',pa:'Dachigam NP',hook:'The state animal of Jammu & Kashmir. Reduced from a few thousand in the early twentieth century to a low point in the 1970s, then recovered to roughly 260–290 in recent counts.',trap:'Use current figures: recent counts put the hangul at about 260–290, not the sub-150 figures of the 1970s trough. It is the only surviving Asiatic red-deer-group taxon in India.',legal:'WPA Schedule I',asOf:'2021 census and later reports'},
{id:'s41',name:'Nilgiri Tahr',sci:'Nilgiritragus hylocrius',taxon:'Mammalia · Artiodactyla · Bovidae — a goat-antelope, not a true goat',iucn:'EN',grp:'Mammal',habitat:'ENDEMIC to the montane shola-grassland of the southern Western Ghats, Kerala and Tamil Nadu',ecology:'Cliff-adapted grazer of high-altitude grassland; adult males are "saddlebacks" with a pale dorsal patch',pa:'Eravikulam NP (largest population), Anamalai, Mukurthi, Kalakad Mundanthurai',hook:'THE STATE ANIMAL OF TAMIL NADU, though its largest population lies in Eravikulam National Park in KERALA. Project Nilgiri Tahr was launched by Tamil Nadu in 2023.',trap:'Endemic to the WESTERN GHATS — it is not a Himalayan tahr. Placed in its own genus Nilgiritragus, separate from Hemitragus.',legal:'WPA Schedule I',asOf:''},
{id:'s42',name:'Foxtail Orchid',sci:'Rhynchostylis retusa',taxon:'Plantae · Asparagales · Orchidaceae',iucn:'Not separately assessed as threatened',grp:'Plant',habitat:'North-east India and much of tropical Asia — India, Sri Lanka, Nepal, Bhutan, Myanmar, China, SE Asia',ecology:'EPIPHYTIC — grows on other plants for support, drawing moisture from air and rain, and is NOT a parasite; drooping cylindrical inflorescence resembling a fox tail',pa:'North-east Indian forests; widely cultivated',hook:"Known as Kopou Phool in Assam, worn by Bihu dancers and central to Bohag Bihu. It is the STATE FLOWER OF ASSAM and also the state flower of ARUNACHAL PRADESH.",trap:"Two traps. It IS epiphytic — correct. But it is NOT endemic to north-east India: it ranges widely across tropical Asia. So in a three-statement question, epiphytic and state-flower are true while endemism is false.",legal:'',asOf:''},
{id:'s43',name:'Neelakurinji',sci:'Strobilanthes kunthiana',taxon:'Plantae · Lamiales · Acanthaceae',iucn:'Assessed on the Red List in recent years',grp:'Plant',habitat:'Montane shola-grassland of the Western Ghats — Munnar, Eravikulam, Nilgiris, Anamalais',ecology:'MASTING plant — flowers gregariously roughly once every TWELVE YEARS, then dies after setting seed (monocarpic)',pa:'Eravikulam NP, Mukurthi NP',hook:'Twelve-year mass flowering turns entire hillsides blue and gives the Nilgiris (blue mountains) their name. The Muthuvan people traditionally reckoned age by kurinji flowering cycles.',trap:'Strobilanthes kunthiana is the twelve-year species. Other Strobilanthes species flower on different cycles, so "kurinji" alone does not imply twelve years.',legal:'',asOf:''},
{id:'s44',name:'Nepenthes khasiana',sci:'Nepenthes khasiana',taxon:'Plantae · Caryophyllales · Nepenthaceae',iucn:'EN',grp:'Plant',habitat:'ENDEMIC to the Khasi and Jaintia hills of MEGHALAYA',ecology:'INSECTIVOROUS pitcher plant; the pitcher is a modified leaf tip holding digestive fluid; grows on nutrient-poor, especially nitrogen-poor, soils',pa:'Baghmara Pitcher Plant Sanctuary, Meghalaya',hook:"India's only endemic pitcher plant, locally called Tiew-rakot or Memang-koksi. Its carnivory is an adaptation to nitrogen-poor soils rather than a substitute for photosynthesis.",trap:'Listed in SCHEDULE VI of the Wild Life (Protection) Act. Schedule VI covers specified PLANTS — and the implication of Schedule VI listing is that a LICENCE IS REQUIRED TO CULTIVATE the plant, not that cultivation is banned outright.',legal:'WPA Schedule VI; CITES Appendix I',asOf:''},
{id:'s45',name:'Red Sanders',sci:'Pterocarpus santalinus',taxon:'Plantae · Fabales · Fabaceae',iucn:'NT',grp:'Plant',habitat:'ENDEMIC to a small tract of the southern EASTERN GHATS in Andhra Pradesh — Seshachalam, Palakonda, Veligonda hills',ecology:'Slow-growing deciduous tree valued for dense red heartwood; not aromatic, unlike true sandalwood',pa:'Sri Venkateswara NP, Seshachalam Biosphere Reserve',hook:'Endemic to a narrow belt of the Eastern Ghats and among the most heavily smuggled Indian timbers, chiefly to East Asia for furniture and musical instruments.',trap:'RED SANDERS (Pterocarpus santalinus, Eastern Ghats, not aromatic) is entirely distinct from SANDALWOOD (Santalum album, aromatic, Karnataka/Tamil Nadu). Red sanders is listed on CITES Appendix II.',legal:'CITES Appendix II',asOf:''},
{id:'s46',name:'Hispid Hare',sci:'Caprolagus hispidus',taxon:'Mammalia · Lagomorpha · Leporidae',iucn:'EN',grp:'Mammal',habitat:'Tall wet terai and Brahmaputra grassland — Manas, Dudhwa, Valmiki, Jaldapara',ecology:'Coarse bristly fur; short ears; a grassland obligate that cannot persist where tall grass is burnt or converted',pa:'Manas, Dudhwa, Valmiki, Jaldapara',hook:'Sometimes called the Assam rabbit. It shares its tall-grassland habitat with the pygmy hog and Bengal florican, so all three respond to the same threat — annual grassland burning and conversion.',trap:'',legal:'WPA Schedule I',asOf:''},
{id:'s47',name:'Golden Langur',sci:'Trachypithecus geei',taxon:'Mammalia · Primates · Cercopithecidae',iucn:'EN',grp:'Mammal',habitat:'A narrow belt between the MANAS and SANKOSH rivers in western Assam, and adjoining Bhutan',ecology:'Arboreal and folivorous; golden to cream coat that darkens seasonally',pa:'Chakrashila WLS, Manas NP, Ripu-Chirang',hook:'Confined between two rivers, which act as natural barriers — a textbook case of riverine range limitation. First described scientifically in the 1950s and named after E. P. Gee.',trap:'',legal:'WPA Schedule I',asOf:''},
{id:'s48',name:'Sloth Bear',sci:'Melursus ursinus',taxon:'Mammalia · Carnivora · Ursidae',iucn:'VU',grp:'Mammal',habitat:'Across peninsular and central India, plus the terai and the Eastern and Western Ghats',ecology:'MYRMECOPHAGOUS — feeds largely on termites and ants, with a gap in the upper incisors forming a suction tube; mostly NOCTURNAL; carries cubs on its back',pa:'Daroji Bear Sanctuary, Ratanmahal, Jessore, Gir, Satpura',hook:'The only bear that routinely carries its cubs on its back. Formerly exploited as the dancing bear of street performance, a practice ended through rescue and rehabilitation, including the Agra Bear Rescue Facility beside Sur Sarovar.',trap:'Despite being in Carnivora, the sloth bear is chiefly insectivorous and frugivorous.',legal:'WPA Schedule I; CITES Appendix I',asOf:''},
];

/* ===== CONCEPTS & LAW ===== */
const CONCEPTS=[
{id:'c1',name:'National Park vs Wildlife Sanctuary',topic:'Protected Area Law',cue:'How do the two core protected-area categories differ under the Wild Life (Protection) Act, 1972?',detail:'NP: Section 35, WPA 1972 · WLS: Section 26A, WPA 1972',hook:"NATIONAL PARK — no human activity permitted, no grazing, no rights allowed once settled; boundaries can be altered only by a resolution of the STATE LEGISLATURE. WILDLIFE SANCTUARY — certain regulated human activities and rights may be permitted by the Chief Wildlife Warden; boundary alteration also requires a state legislature resolution, and for both, de-notification now needs NBWL recommendation. A sanctuary can be upgraded to a National Park, but not the reverse.",trap:'Both NP and WLS boundary changes require a state legislature resolution — the older distinction that only NPs did is outdated after the 1991 and 2002 amendments. The real practical difference is the degree of permitted human use.'},
{id:'c2',name:'Community Reserve',topic:'Protected Area Law',cue:'What is a Community Reserve and who governs it?',detail:'Introduced by the Wild Life (Protection) Amendment Act, 2002',hook:"Declared over COMMUNITY OR PRIVATE LAND — not government land — where a community or individual has volunteered to conserve wildlife. Governed by a COMMUNITY RESERVE MANAGEMENT COMMITTEE, not by the Chief Wildlife Warden. HUNTING IS PROHIBITED. Traditional agricultural practices and collection of non-timber forest produce by local people continue.",trap:'The governing authority is the Community Reserve Management Committee — NOT the Chief Wildlife Warden. That distinction is the usual trap. Hunting is banned; NTFP collection and traditional agriculture are allowed.'},
{id:'c3',name:'Conservation Reserve',topic:'Protected Area Law',cue:'What is a Conservation Reserve and how does it differ from a Community Reserve?',detail:'Introduced by the WPA Amendment Act, 2002',hook:'Declared over GOVERNMENT-OWNED LAND, typically adjoining a National Park or Sanctuary, or land linking protected areas, to act as a buffer or corridor. Declared after consultation with local communities. Managed through a Conservation Reserve Management Committee. Examples that are also Ramsar Sites: Asan (Uttarakhand), Beas (Punjab), Hygam and Shallabugh (J&K), Chhari-Dhand (Gujarat).',trap:'CONSERVATION Reserve = GOVERNMENT land. COMMUNITY Reserve = COMMUNITY or PRIVATE land. That is the single cleanest way to keep the two apart.'},
{id:'c4',name:'Wild Life (Protection) Act — Schedules',topic:'Protected Area Law',cue:'What do the WPA schedules mean, and what does Schedule VI imply?',detail:'WPA 1972; substantially restructured by the 2022 Amendment',hook:"Historically: Schedule I and Schedule II Part II carried the highest protection with the severest penalties; Schedules III and IV covered protected but less severely penalised species; Schedule V listed VERMIN (common crow, fruit bats, rats, mice); SCHEDULE VI listed SPECIFIED PLANTS. The 2022 Amendment consolidated animals into fewer schedules and added a schedule for CITES-listed specimens.",trap:'SCHEDULE VI applies to PLANTS, and its effect is that A LICENCE IS REQUIRED TO CULTIVATE the listed plant — cultivation is regulated, not banned outright. Schedule VI does not mean the plant is genetically modified or invasive.'},
{id:'c5',name:'Ownership of Wild Animals in Indian Law',topic:'Protected Area Law',cue:'Who owns wild animals, and does protection extend outside protected areas?',detail:'WPA 1972, notably Sections 39 and 11',hook:'Every wild animal that is hunted, or found dead, or killed by mistake, and every animal specimen taken, is GOVERNMENT PROPERTY under Section 39. Protection attaches to the SPECIES, not to the place — a Schedule I animal is equally protected inside and outside a protected area.',trap:'Section 11 permits the Chief Wildlife Warden to allow the killing or capture of a dangerous animal, but only if the animal CANNOT BE TRANQUILLISED OR TRANSLOCATED and is genuinely dangerous to human life. MERE APPREHENSION of danger is NOT sufficient ground — the animal must actually have become dangerous or be disabled or diseased beyond recovery.'},
{id:'c6',name:'Ramsar Convention — obligations',topic:'International Conventions',cue:'What does the Ramsar Convention actually require of India?',detail:'Convention on Wetlands, adopted 2 February 1971 at Ramsar, Iran; in force in India from 1 February 1982',hook:'The three pillars are: designate and maintain the ecological character of listed Ramsar Sites; promote the WISE USE of all wetlands in the territory through national planning; and cooperate internationally on transboundary wetlands and shared species. Ramsar is a standalone intergovernmental treaty, NOT a UN convention.',trap:"It is NOT mandatory for India to protect and conserve ALL wetlands in its territory under the Convention — the binding site-specific duty attaches to LISTED sites; for other wetlands the obligation is the softer duty to promote 'wise use'."},
{id:'c7',name:'Wetlands (Conservation and Management) Rules',topic:'Environmental Law',cue:'Under what law are Indian wetlands regulated, and what do the Rules cover?',detail:'Rules of 2010, superseded by the Wetlands (Conservation and Management) Rules, 2017',hook:'Framed under the ENVIRONMENT (PROTECTION) ACT, 1986 — an Indian statute — not directly under the Ramsar Convention. The 2010 Rules created a Central Wetlands Regulatory Authority; the 2017 Rules decentralised this to State/UT Wetlands Authorities and required states to prepare wetland inventories and lists. The Rules expressly extend to the ZONE OF INFLUENCE, meaning the drainage area or catchment as determined by the authority.',trap:'The Rules derive from the Environment (Protection) Act, 1986. Saying they were framed "based on the recommendations of the Ramsar Convention" misstates the legal basis. But it IS correct that they encompass catchment/drainage areas.'},
{id:'c8',name:'Montreux Record',topic:'International Conventions',cue:'What is the Montreux Record and which Indian sites are on it?',detail:'A register maintained under the Ramsar Convention',hook:'A register of Ramsar Sites where changes in ecological character have occurred, are occurring, or are likely to occur, from technological development, pollution or other human interference. Indian sites on it: KEOLADEO NATIONAL PARK (Rajasthan) and LOKTAK LAKE (Manipur).',trap:'CHILIKA LAKE was placed on the Montreux Record in 1993 and REMOVED in 2002 after restoration — it is a removal success story, not a current entry. Being on the Record is not a penalty; it is a flag that triggers advisory support.'},
{id:'c9',name:'IUCN Red List — structure',topic:'Conservation Status',cue:'How is the IUCN Red List organised and what counts as "threatened"?',detail:'IUCN founded 1948; Red List since 1964; headquarters at Gland, Switzerland',hook:"Nine categories in order: EX, EW, CR, EN, VU, NT, LC, DD, NE. 'THREATENED' means exactly three of them — CR, EN and VU. The IUCN is an international NGO with a hybrid membership of states and civil-society bodies; it is NOT a United Nations body. BirdLife International is the Red List Authority for birds and identifies Important Bird and Biodiversity Areas.",trap:'The BIODIVERSITY HOTSPOT concept came from Norman Myers and was taken up by Conservation International — NOT from BirdLife International. India has four hotspots: Himalaya, Western Ghats–Sri Lanka, Indo-Burma, and Sundaland (Nicobar Islands).'},
{id:'c10',name:'Diclofenac and the vulture collapse',topic:'Conservation Case Study',cue:'What caused the collapse of Indian vulture populations, and what followed?',detail:'Collapse through the 1990s; cause identified 2003–04; veterinary ban 2006',hook:'Vulture numbers fell by more than 99% in the 1990s. The cause was DICLOFENAC, a non-steroidal anti-inflammatory given to cattle; vultures feeding on treated carcasses suffered fatal kidney failure and visceral gout. Veterinary diclofenac was banned in 2006 and MELOXICAM promoted as the safe alternative. Conservation breeding centres and Vulture Safe Zones followed.',trap:'The knock-on effects are the examinable part: carcasses persisted longer, feral dog numbers rose, and rabies risk increased. Ketoprofen and aceclofenac were subsequently also found toxic to vultures, so the problem did not end with the 2006 ban.'},
{id:'c11',name:'Critical Tiger Habitat',topic:'Protected Area Law',cue:'What is a Critical Tiger Habitat and which reserve has the largest?',detail:'Section 38V, WPA 1972, inserted by the 2006 amendment; NTCA',hook:'The core area of a Tiger Reserve identified on scientific evidence as required to be kept inviolate for tiger conservation, notified in consultation with an expert committee and WITHOUT PREJUDICE TO THE RIGHTS OF FOREST DWELLERS under the Forest Rights Act. NAGARJUNSAGAR–SRISAILAM has the largest area under Critical Tiger Habitat.',trap:'A Tiger Reserve has two parts: the CORE or Critical Tiger Habitat, and a BUFFER or peripheral area where coexistence is the goal. Only the core is meant to be inviolate.'},
{id:'c12',name:'Biosphere Reserves in India',topic:'Protected Area Law',cue:'How are Biosphere Reserves structured and which are on the UNESCO MAB network?',detail:'UNESCO Man and the Biosphere Programme; 18 Indian Biosphere Reserves, 12 on the world network',hook:'Three concentric zones: a legally protected CORE, a managed BUFFER, and a TRANSITION zone of sustainable use. NILGIRI was the first Indian Biosphere Reserve, declared in 1986. Others on the UNESCO network include Gulf of Mannar, Sundarbans, Nanda Devi, Nokrek, Pachmarhi, Similipal, Achanakmar-Amarkantak, Great Nicobar, Agasthyamalai, Khangchendzonga and Panna.',trap:'AGASTHYAMALAI Biosphere Reserve comprises NEYYAR, PEPPARA and SHENDURNEY Wildlife Sanctuaries together with KALAKAD MUNDANTHURAI Tiger Reserve. Do not confuse it with the Nilgiri cluster (Mudumalai, Sathyamangalam, Wayanad, Silent Valley).'},
{id:'c13',name:'Project Tiger and the NTCA',topic:'Conservation Programmes',cue:'When did Project Tiger begin and how many Tiger Reserves are there now?',detail:'Launched 1 April 1973 with nine reserves; NTCA constituted 2006',hook:'Project Tiger began in 1973 with nine reserves including Corbett, Kanha, Bandipur, Manas, Melghat, Palamau, Ranthambore, Simlipal and Sundarbans. India now has 58 Tiger Reserves, the most recent being MADHAV (Madhya Pradesh, 2025), preceded by Ratapani (MP, 2024) and Guru Ghasidas–Tamor Pingla (Chhattisgarh, 2024). Madhya Pradesh has nine reserves, the most of any state.',trap:'The National Tiger Conservation Authority is a STATUTORY body created by the 2006 amendment to the WPA — it was not part of the original 1973 scheme, which ran as a centrally sponsored programme.'},
{id:'c14',name:'Project Dolphin and Project Elephant',topic:'Conservation Programmes',cue:'What do Project Dolphin and Project Elephant cover?',detail:'Project Elephant 1992; Project Dolphin announced 2020',hook:'PROJECT ELEPHANT (1992) protects elephants, their habitat and corridors, and also addresses captive elephant welfare and human–elephant conflict; the elephant was declared a National Heritage Animal in 2010. PROJECT DOLPHIN (announced 2020) covers BOTH riverine and marine dolphins and produced the first comprehensive river dolphin survey, estimating 6,327 river dolphins in India.',trap:'Project Dolphin covers marine dolphins as well as river dolphins — it is not restricted to the Ganges river dolphin, even though that species is the National Aquatic Animal.'},
{id:'c15',name:'India — endemism and "found in India only"',topic:'Distribution',cue:'Which well-known large mammals are genuinely restricted to India?',detail:'A recurring statement-based question format',hook:'GENUINELY INDIA-ONLY in the wild: Asiatic lion (Gir landscape), sangai (Keibul Lamjao), hangul (Dachigam), Nilgiri tahr (Western Ghats), lion-tailed macaque (Western Ghats), grizzled giant squirrel and Nilgiri langur. NOT India-only: one-horned rhinoceros (also Nepal), Bactrian camel (Mongolia, China, Central Asia), tiger, elephant, snow leopard, gaur, dhole.',trap:'The classic trio: Asiatic lion IS India-only; double-humped camel is NOT; one-horned rhinoceros is NOT (Nepal has a substantial population in Chitwan).'},
{id:'c16',name:'Deer of India — keeping them apart',topic:'Taxonomy',cue:'How do barasingha, sangai, musk deer, hangul and chital differ?',detail:'A high-yield discrimination set',hook:'BARASINGHA / swamp deer (Rucervus duvaucelii): hard-ground subspecies branderi at KANHA, wet-ground duvaucelii at Dudhwa, eastern ranjitsinhi at Kaziranga. SANGAI (Rucervus eldii eldii): Keibul Lamjao phumdis, Manipur. HANGUL (Cervus hanglu hanglu): Dachigam, J&K. MUSK DEER (Moschus, family MOSCHIDAE, no antlers): high Himalaya. CHITAL (Axis axis): the common spotted deer of the plains.',trap:'Musk deer are NOT Cervidae — they belong to the family Moschidae, have no antlers, and males bear tusk-like canines instead.'},
{id:'c17',name:'Crocodilians and turtles of India',topic:'Taxonomy',cue:'Which crocodilians and marine turtles occur in India and at what status?',detail:'Crocodile Conservation Project from 1975',hook:'THREE crocodilians: GHARIAL (CR, narrow fish-catching snout, Chambal), MUGGER (VU, broad snout, generalist, widespread), SALTWATER CROCODILE (LC, estuarine, Bhitarkanika and Sundarbans). FIVE sea turtles in Indian waters: olive ridley (VU), green (EN), hawksbill (CR), loggerhead (VU), leatherback (VU).',trap:'The hawksbill is the Critically Endangered sea turtle; olive ridley, despite its fame at Gahirmatha, is only Vulnerable.'},
{id:'c18',name:'Basin placement of protected areas',topic:'Geography',cue:'Which major protected areas sit in the Cauvery basin?',detail:'A repeatedly tested geographical pattern',hook:'IN THE CAUVERY BASIN: Nagarhole (Kabini), Bandipur (Kabini and Moyar), Mudumalai (Moyar), Wayanad (Kabani), Sathyamangalam (Bhavani and Moyar), Ranganathittu (on the Cauvery itself), Cauvery WLS, BRT Tiger Reserve. NOT in the Cauvery basin: PAPIKONDA, which lies on the GODAVARI in Andhra Pradesh.',trap:'The Nilgiri cluster looks like Western Ghats forest but drains east through the Moyar and Kabini into the CAUVERY. Papikonda is the standard odd one out in this question type.'},
];
